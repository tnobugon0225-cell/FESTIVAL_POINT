<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>NEW PLAYER | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"></head><body class="player-page register-page"><div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="scanline"></div></div><nav class="topbar"><a class="brand-mini" href="/"><span class="brand-pulse"></span>NEXUS:ZERO</a></nav><main class="app-shell register-shell"><section class="system-panel register-panel"><div class="hero-lockup integrated-lockup"><img src="/nexus-zero-header-integrated.webp" alt="NEXUS:ZERO" class="hero-logo integrated-header-logo"></div><div class="panel-head"><div><div class="eyebrow">NEW PLAYER ACCESS</div><h1>新規アカウント作成</h1></div><span id="gateState" class="status-light">CHECKING</span></div><div id="registerForm"><label>PLAYER NAME</label><input id="username" maxlength="20" autocomplete="nickname" placeholder="2〜20文字"><label>PASSWORD</label><input id="password" type="password" maxlength="72" autocomplete="new-password" placeholder="6文字以上"><label>PASSWORD CONFIRM</label><input id="passwordConfirm" type="password" maxlength="72" autocomplete="new-password" placeholder="もう一度入力"><div class="eyebrow register-avatar-label">SELECT AVATAR</div><div class="avatar-selector" id="avatarSelector"></div><button id="registerBtn" class="primary-action" type="button">CREATE PLAYER</button><p class="system-note">作成後に表示される4桁のPLAYER IDはログインに必要です。</p></div><div id="registerResult" class="hidden"></div><p id="registerMsg" class="error"></p></section></main><script>const $=s=>document.querySelector(s);let selectedAvatar='avatar-01';const av=$('#avatarSelector');av.innerHTML=Array.from({length:12},(_,i)=>{const k=`avatar-${String(i+1).padStart(2,'0')}`;return `<button type="button" class="avatar-choice ${i===0?'selected':''}" data-avatar="${k}"><img src="/avatars/${k}.webp" alt="avatar ${i+1}"></button>`}).join('');av.onclick=e=>{const b=e.target.closest('[data-avatar]');if(!b)return;selectedAvatar=b.dataset.avatar;document.querySelectorAll('.avatar-choice').forEach(x=>x.classList.toggle('selected',x===b))};async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信に失敗しました');return d}async function status(){try{const r=await api('/api/registration/status');$('#gateState').textContent=r.enabled?'REGISTRATION OPEN':'REGISTRATION CLOSED';$('#registerForm').classList.toggle('hidden',!r.enabled);if(!r.enabled)$('#registerMsg').textContent='現在、新規登録は受け付けていません。'}catch(e){$('#registerForm').classList.add('hidden');$('#registerMsg').textContent=e.message}}$('#registerBtn').onclick=async()=>{const btn=$('#registerBtn');$('#registerMsg').textContent='';try{btn.disabled=true;const r=await api('/api/register',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value,passwordConfirm:$('#passwordConfirm').value,avatarKey:selectedAvatar})});$('#registerForm').classList.add('hidden');$('#registerResult').classList.remove('hidden');$('#registerResult').innerHTML=`<div class="registration-success"><div class="eyebrow">ACCOUNT CREATED</div><h2>${r.username}</h2><div class="customer-number register-code">PLAYER ID ${r.code}</div><p>初期ポイント：<strong>${r.startingPoints} pt</strong></p><p class="system-note">この4桁のIDとパスワードを忘れないようにしてください。</p><a class="primary-action register-login-link" href="/">ログイン画面へ</a></div>`}catch(e){$('#registerMsg').textContent=e.message}finally{btn.disabled=false}};status();</script></body></html>
