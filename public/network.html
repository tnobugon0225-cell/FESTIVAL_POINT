<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>NEXUS NETWORK</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script><script src="/ui-fx.js" defer></script></head>
<body class="player-page network-page"><div class="cyber-bg"><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/" data-nexus-nav="HOME"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><a href="/" data-nexus-nav="HOME">HOME</a><a href="/rule" data-nexus-nav="RULE">RULE</a><a href="/ranking" data-nexus-nav="RANKING">RANKING</a><a href="/history" data-nexus-nav="HISTORY">HISTORY</a></div></nav>
<main class="app-shell arena-shell"><section class="system-panel network-stage-panel">
<div id="networkScreen"><div class="network-screen-nav"><button data-tab="chat"><img src="/ui/global-chat.webp" alt="GLOBAL CHAT"></button><button data-tab="friends"><img src="/ui/friends.webp" alt="FRIENDS"></button><button data-tab="live"><img src="/ui/live-battle.webp" alt="LIVE BATTLE"></button></div>
<div id="chat" class="network-tab hidden"><div id="chatList" class="chat-list"></div><div class="chat-compose global-compose"><input id="chatInput" maxlength="30" placeholder="全体メッセージ / 30文字まで"><button id="chatSend" class="art-small-button"><img src="/ui/send.webp" alt="送信"></button></div><p id="chatCooldown" class="system-note"></p></div>
<div id="friends" class="network-tab hidden"><div class="friend-search"><input id="friendCode" inputmode="numeric" maxlength="4" placeholder="PLAYER ID"><button id="friendSearchBtn" class="network-image-button" type="button"><img src="/ui/search.webp" alt="SEARCH"></button></div><div id="friendSearchResult"></div><div id="friendList"></div><div id="dmBox" class="dm-box hidden"><div class="dm-head"><strong id="dmName"></strong><button id="dmClose">×</button></div><div id="dmMessages" class="dm-messages"></div><div class="chat-compose dm-compose"><input id="dmInput" type="text" maxlength="100" autocomplete="off" autocapitalize="off" enterkeyhint="send" placeholder="個別メッセージを入力"><button id="dmSend" type="button" class="art-small-button"><img src="/ui/send.webp" alt="送信"></button></div><p id="dmStatus" class="system-note"></p></div></div>
<div id="live" class="network-tab hidden"><div id="liveList" class="live-match-list"></div></div></div>
</section></main><div id="profileAction" class="nexus-picker hidden"><div class="nexus-picker-card compact-profile-card"><button id="profileClose" class="picker-close">×</button><div id="profileBody"></div><button id="profileFriend" class="profile-art-action"><img src="/ui/friend-request.webp" alt="フレンド申請"></button><button id="profileBattle" class="profile-art-action"><img src="/ui/fight-request.webp" alt="対戦申請"></button></div></div><script>
const $=s=>document.querySelector(s),token=localStorage.getItem('nexusParticipantToken')||'';const pressRun=(el,fn)=>window.NexusUI?.pulsePress?window.NexusUI.pulsePress(el,fn):fn();if(!token)location.href='/';const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const api=async(u,o={})=>{const r=await fetch(u,{cache:'no-store',...o,headers:{'Content-Type':'application/json','X-Participant-Token':token,Authorization:'Bearer '+token,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信エラー');return d};const av=k=>`/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(k||'')?k:'avatar-01'}.webp`;let selectedProfile=null,dmUser=null,cooldownUntil=0;let chatSig='',friendsSig='',liveSig='',dmSig='';
function titleImg(t){return t?.image||'/titles/rookie.webp'}function profileMini(u){return `<button class="chat-avatar" data-profile='${JSON.stringify(u).replaceAll("'","&#39;")}'><img src="${av(u.avatarKey)}"></button><div class="chat-id"><img class="mini-title-img" src="${titleImg(u.title)}"><strong>${esc(u.name)}</strong></div>`}function profileDetail(u){return `<div class="profile-avatar-large"><img src="${av(u.avatarKey)}" alt=""></div><div class="profile-copy"><img class="profile-title-large" src="${titleImg(u.title)}" alt=""><span class="profile-kicker profile-name-label">PLAYER NAME</span><strong class="profile-name">${esc(u.name)}</strong></div>`}
function openNetworkScreen(tab,push=true){if(!['chat','friends','live'].includes(tab))tab='chat';document.querySelectorAll('.network-tab').forEach(x=>x.classList.add('hidden'));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('#'+tab).classList.remove('hidden');if(push)history.replaceState(null,'','#'+tab);if(tab==='chat')loadChat();if(tab==='friends')loadFriends();if(tab==='live')loadLive()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>pressRun(b,()=>openNetworkScreen(b.dataset.tab)));const h=location.hash.slice(1);openNetworkScreen(['chat','friends','live'].includes(h)?h:'chat',false);
async function loadChat(){try{const d=await api('/api/chat/global');const sig=JSON.stringify(d.map(m=>[m.id,m.message,m.createdAt,m.user?.id,m.user?.avatarKey,m.user?.title?.key||m.user?.title?.image]));if(sig===chatSig)return;chatSig=sig;const box=$('#chatList');const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;const oldTop=box.scrollTop;box.innerHTML=d.map(m=>`<div class="chat-row">${profileMini(m.user)}<div class="chat-bubble">${esc(m.message)}<small>${new Date(m.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')||'<p class="system-note">まだメッセージはありません。</p>';if(near)box.scrollTop=box.scrollHeight;else box.scrollTop=oldTop}catch(e){$('#chatCooldown').textContent=e.message}}
async function sendGlobalChat(){
  const m=$('#chatInput').value.trim();if(!m)return;
  try{
    const d=await api('/api/chat/global',{method:'POST',body:JSON.stringify({message:m})});
    $('#chatInput').value='';
    cooldownUntil=Date.now()+(d.cooldownMs||15000);
    $('#chatCooldown').textContent='送信しました';
    await loadChat();
  }catch(e){
    $('#chatCooldown').textContent=e.message;
    if(/あと\d+秒/.test(e.message)){const n=Number((e.message.match(/(\d+)/)||[])[1]||15);cooldownUntil=Date.now()+n*1000;}
  }
}
$('#chatSend').onclick=sendGlobalChat;
$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendGlobalChat();}});setInterval(()=>{const n=Math.ceil((cooldownUntil-Date.now())/1000);$('#chatSend').disabled=n>0;$('#chatCooldown').textContent=n>0?`再送信まで ${n} 秒`:''},250);
document.addEventListener('click',e=>{const b=e.target.closest('[data-profile]');if(!b)return;try{selectedProfile=JSON.parse(b.dataset.profile);$('#profileBody').innerHTML=profileDetail(selectedProfile);$('#profileAction').classList.remove('hidden')}catch{}});$('#profileClose').onclick=()=>$('#profileAction').classList.add('hidden');$('#profileFriend').onclick=async()=>{try{await api('/api/friends/request',{method:'POST',body:JSON.stringify({userId:selectedProfile.id})});alert('フレンド申請を送信しました');$('#profileAction').classList.add('hidden')}catch(e){alert(e.message)}};$('#profileBattle').onclick=()=>{location.href='/?challenge='+selectedProfile.code};
$('#friendSearchBtn').onclick=async()=>{try{const d=await api('/api/friends/search?code='+encodeURIComponent($('#friendCode').value));$('#friendSearchResult').innerHTML=`<div class="friend-card">${profileMini(d.user)}${d.friendship?.status==='accepted'?`<div class="friend-actions"><button class="dm-open-btn network-image-button" type="button" data-dm-user="${d.user.id}" data-dm-name="${esc(d.user.name)}"><img src="/ui/message.webp" alt="MESSAGE"></button><small>FRIEND</small></div>`:d.friendship?`<span class="friend-state">申請状態: ${esc(d.friendship.status)}</span>`:`<button class="friend-art-btn" data-request-user="${d.user.id}"><img src="/ui/friend-request.webp" alt="フレンド申請"></button>`}</div>`}catch(e){alert(e.message)}};document.addEventListener('click',async e=>{const r=e.target.closest('[data-request-user]');if(r){try{await api('/api/friends/request',{method:'POST',body:JSON.stringify({userId:Number(r.dataset.requestUser)})});loadFriends()}catch(x){alert(x.message)}}const a=e.target.closest('[data-accept-friend]');if(a){await api('/api/friends/'+a.dataset.acceptFriend+'/accept',{method:'POST'});loadFriends()}const d=e.target.closest('[data-dm-user]');if(d){dmUser={id:Number(d.dataset.dmUser),name:d.dataset.dmName};openDm()}});
async function loadFriends(){try{const d=await api('/api/friends');const sig=JSON.stringify(d.map(f=>[f.id,f.status,f.direction,f.user?.id,f.user?.name,f.user?.avatarKey,f.user?.title?.key||f.user?.title?.image]));if(sig===friendsSig)return;friendsSig=sig;$('#friendList').innerHTML=d.map(f=>`<div class="friend-card">${profileMini(f.user)}<div class="friend-actions">${f.status==='pending'&&f.direction==='incoming'?`<button class="friend-art-btn" data-accept-friend="${f.id}"><img src="/ui/approve.webp" alt="承認"></button>`:''}${f.status==='accepted'?`<button class="dm-open-btn network-image-button" type="button" data-dm-user="${f.user.id}" data-dm-name="${esc(f.user.name)}"><img src="/ui/message.webp" alt="MESSAGE"></button>`:''}<small>${f.status==='accepted'?'FRIEND':f.direction==='incoming'?'申請を受信':'申請中'}</small></div></div>`).join('')||'<p class="system-note">まだフレンドはいません。</p>'}catch(e){}}
let dmLoadSeq=0,dmSending=false;async function openDm(){if(!dmUser)return;dmSig='';$('#dmName').textContent=dmUser.name;$('#dmStatus').textContent='';$('#dmBox').classList.remove('hidden');document.body.classList.add('dm-open');await loadDm(true);requestAnimationFrame(()=>{const input=$('#dmInput');if(input){input.style.display='block';input.removeAttribute('hidden')}})}async function loadDm(force=false){if(!dmUser)return;const targetId=dmUser.id,seq=++dmLoadSeq;try{const d=await api('/api/friends/'+targetId+'/messages');if(!dmUser||dmUser.id!==targetId||seq!==dmLoadSeq)return;const sig=JSON.stringify(d.map(m=>[m.id,m.senderId,m.message,m.createdAt]));if(!force&&sig===dmSig)return;dmSig=sig;const box=$('#dmMessages');const near=box.scrollHeight-box.scrollTop-box.clientHeight<100;const oldTop=box.scrollTop;box.innerHTML=d.map(m=>`<div class="dm-msg ${m.senderId===targetId?'other':'mine'}"><span>${esc(m.message)}</span></div>`).join('')||'<p class="system-note">まだメッセージはありません。</p>';if(near||force)box.scrollTop=box.scrollHeight;else box.scrollTop=oldTop;$('#dmStatus').textContent=''}catch(e){if(dmUser&&dmUser.id===targetId)$('#dmStatus').textContent=e.message}}async function sendDm(){const m=$('#dmInput').value.trim();if(!m||!dmUser||dmSending)return;const targetId=dmUser.id;dmSending=true;$('#dmSend').disabled=true;$('#dmStatus').textContent='送信中...';try{await api('/api/friends/'+targetId+'/messages',{method:'POST',body:JSON.stringify({message:m})});if(dmUser&&dmUser.id===targetId){$('#dmInput').value='';dmSig='';await loadDm(true)}}catch(e){$('#dmStatus').textContent=e.message}finally{dmSending=false;$('#dmSend').disabled=false}}$('#dmSend').onclick=sendDm;$('#dmInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendDm()}});$('#dmClose').onclick=()=>{dmLoadSeq++;$('#dmBox').classList.add('hidden');document.body.classList.remove('dm-open');dmUser=null;$('#dmStatus').textContent=''};setInterval(()=>{if(dmUser&&!$('#dmBox').classList.contains('hidden'))loadDm()},2200);
let liveLoading=false;async function loadLive(){if(liveLoading)return;liveLoading=true;try{const d=await api('/api/live-matches');const all=[...d.quick.map(m=>({k:'quick',m})),...d.custom.map(m=>({k:'custom',m}))];const sig=JSON.stringify(all.map(({k,m})=>[k,m.id,m.gameType,m.status,m.wager,m.challenger?.id,m.challenger?.name,m.opponent?.id,m.opponent?.name]));if(sig===liveSig)return;liveSig=sig;const box=$('#liveList');const html=all.map(({k,m})=>`<a class="live-match-card" href="${k==='quick'?'/watch?kind=quick&id='+m.id:'#'}"><div><b>${k==='quick'?m.gameType.toUpperCase():'CUSTOM'}</b><strong>${esc(m.challenger.name)} <i>VS</i> ${esc(m.opponent.name)}</strong></div><span>${m.wager}pt<img class="live-watch-art" src="/ui/watch.webp" alt="観戦"></span></a>`).join('')||'<p class="system-note">現在進行中の試合はありません。</p>';if(box.innerHTML!==html)box.innerHTML=html}catch(e){}finally{liveLoading=false}};setInterval(()=>{if(!$('#chat').classList.contains('hidden'))loadChat()},2500);setInterval(()=>{if(!$('#live').classList.contains('hidden'))loadLive()},3000);loadChat();loadFriends();loadLive();window.addEventListener('pointerdown',()=>window.NexusBGM?.prime?.('home'),{once:true});
</script></body></html>
