<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>NEXUS NETWORK</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script><script src="/ui-fx.js" defer></script></head><body class="player-page network-page"><div class="cyber-bg"><div class="scanline"></div></div><nav class="topbar"><a class="brand-mini" href="/" data-nexus-nav="HOME"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><a href="/" data-nexus-nav="HOME">HOME</a><a href="/rule" data-nexus-nav="RULE">RULE</a><a href="/ranking" data-nexus-nav="RANKING">RANKING</a><a href="/history" data-nexus-nav="HISTORY">HISTORY</a></div></nav><main class="app-shell arena-shell"><section class="system-panel"><div class="panel-head"><div><div class="eyebrow">NEXUS NETWORK</div><h1>NETWORK LINK</h1></div><span class="status-light">ONLINE</span></div><div class="network-tabs"><button data-tab="chat">GLOBAL CHAT</button><button data-tab="friends">FRIENDS</button><button data-tab="live">LIVE BATTLE</button></div><div id="chat" class="network-tab"><div id="chatList" class="chat-list"></div><div class="chat-compose"><input id="chatInput" maxlength="30" placeholder="全体メッセージ / 30文字まで"><button id="chatSend">SEND</button></div><p id="chatCooldown" class="system-note"></p></div><div id="friends" class="network-tab hidden"><div class="friend-search"><input id="friendCode" inputmode="numeric" maxlength="4" placeholder="PLAYER ID"><button id="friendSearchBtn">SEARCH</button></div><div id="friendSearchResult"></div><div id="friendList"></div><div id="dmBox" class="dm-box hidden"><div class="dm-head"><strong id="dmName"></strong><button id="dmClose">×</button></div><div id="dmMessages" class="dm-messages"></div><div class="chat-compose"><input id="dmInput" maxlength="100" placeholder="個別メッセージ"><button id="dmSend">SEND</button></div></div></div><div id="live" class="network-tab hidden"><div id="liveList" class="live-match-list"></div></div></section></main><div id="profileAction" class="nexus-picker hidden"><div class="nexus-picker-card compact-profile-card"><button id="profileClose" class="picker-close">×</button><div id="profileBody"></div><button id="profileFriend">フレンド申請</button><button id="profileBattle">対戦申請</button></div></div><script>
const $=s=>document.querySelector(s),token=localStorage.getItem('nexusParticipantToken')||'';if(!token)location.href='/';const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const api=async(u,o={})=>{const r=await fetch(u,{cache:'no-store',...o,headers:{'Content-Type':'application/json','X-Participant-Token':token,Authorization:'Bearer '+token,...(o.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信エラー');return d};const av=k=>`/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(k||'')?k:'avatar-01'}.webp`;let selectedProfile=null,dmUser=null,cooldownUntil=0;let chatSig='',friendsSig='',liveSig='',dmSig='';
function titleImg(t){return t?.image||'/titles/rookie.webp'}function profileMini(u){return `<button class="chat-avatar" data-profile='${JSON.stringify(u).replaceAll("'","&#39;")}'><img src="${av(u.avatarKey)}"></button><div class="chat-id"><strong>${esc(u.name)}</strong><img class="mini-title-img" src="${titleImg(u.title)}"><small>#${esc(u.code)}</small></div>`}function profileDetail(u){return `<div class="profile-avatar-large"><img src="${av(u.avatarKey)}" alt=""></div><div class="profile-copy"><span class="profile-kicker">PLAYER PROFILE</span><strong class="profile-name">${esc(u.name)}</strong><img class="profile-title-large" src="${titleImg(u.title)}" alt=""><small class="profile-code">#${esc(u.code)}</small></div>`}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.network-tab').forEach(x=>x.classList.add('hidden'));
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
  $('#'+b.dataset.tab).classList.remove('hidden');
  b.classList.add('active');
  history.replaceState(null,'','#'+b.dataset.tab);
  if(b.dataset.tab==='friends')loadFriends();
  if(b.dataset.tab==='live')loadLive();
});const h=location.hash.slice(1);const initialTab=['chat','friends','live'].includes(h)?h:'chat';document.querySelector(`[data-tab="${initialTab}"]`)?.click();
async function loadChat(){try{const d=await api('/api/chat/global');const sig=JSON.stringify(d.map(m=>[m.id,m.message,m.createdAt,m.user?.id,m.user?.avatarKey,m.user?.title?.key||m.user?.title?.image]));if(sig===chatSig)return;chatSig=sig;const box=$('#chatList');const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;const oldTop=box.scrollTop;box.innerHTML=d.map(m=>`<div class="chat-row">${profileMini(m.user)}<div class="chat-bubble">${esc(m.message)}<small>${new Date(m.createdAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')||'<p class="system-note">まだメッセージはありません。</p>';if(near)box.scrollTop=box.scrollHeight;else box.scrollTop=oldTop}catch(e){$('#chatCooldown').textContent=e.message}}
async function sendGlobalChat(){
  const m=$('#chatInput').value.trim();if(!m)return;
  try{
    const d=await api('/api/chat/global',{method:'POST',body:JSON.stringify({message:m})});
    $('#chatInput').value='';
    cooldownUntil=Date.now()+(d.cooldownMs||15000);
    $('#chatCooldown').textContent='送信しました';
    await loadChat();
  }catch(e){
    $('#chatCooldown').textContent=e.message;
    if(/あと\d+秒/.test(e.message)){const n=Number((e.message.match(/(\d+)/)||[])[1]||15);cooldownUntil=Date.now()+n*1000;}
  }
}
$('#chatSend').onclick=sendGlobalChat;
$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();sendGlobalChat();}});setInterval(()=>{const n=Math.ceil((cooldownUntil-Date.now())/1000);$('#chatSend').disabled=n>0;$('#chatCooldown').textContent=n>0?`再送信まで ${n} 秒`:''},250);
document.addEventListener('click',e=>{const b=e.target.closest('[data-profile]');if(!b)return;try{selectedProfile=JSON.parse(b.dataset.profile);$('#profileBody').innerHTML=profileDetail(selectedProfile);$('#profileAction').classList.remove('hidden')}catch{}});$('#profileClose').onclick=()=>$('#profileAction').classList.add('hidden');$('#profileFriend').onclick=async()=>{try{await api('/api/friends/request',{method:'POST',body:JSON.stringify({userId:selectedProfile.id})});alert('フレンド申請を送信しました');$('#profileAction').classList.add('hidden')}catch(e){alert(e.message)}};$('#profileBattle').onclick=()=>{location.href='/?challenge='+selectedProfile.code};
$('#friendSearchBtn').onclick=async()=>{try{const d=await api('/api/friends/search?code='+encodeURIComponent($('#friendCode').value));$('#friendSearchResult').innerHTML=`<div class="friend-card">${profileMini(d.user)}<button data-request-user="${d.user.id}">${d.friendship?'申請状態: '+d.friendship.status:'フレンド申請'}</button></div>`}catch(e){alert(e.message)}};document.addEventListener('click',async e=>{const r=e.target.closest('[data-request-user]');if(r){try{await api('/api/friends/request',{method:'POST',body:JSON.stringify({userId:Number(r.dataset.requestUser)})});loadFriends()}catch(x){alert(x.message)}}const a=e.target.closest('[data-accept-friend]');if(a){await api('/api/friends/'+a.dataset.acceptFriend+'/accept',{method:'POST'});loadFriends()}const d=e.target.closest('[data-dm-user]');if(d){dmUser={id:Number(d.dataset.dmUser),name:d.dataset.dmName};openDm()}});
async function loadFriends(){try{const d=await api('/api/friends');const sig=JSON.stringify(d.map(f=>[f.id,f.status,f.direction,f.user?.id,f.user?.name,f.user?.avatarKey,f.user?.title?.key||f.user?.title?.image]));if(sig===friendsSig)return;friendsSig=sig;$('#friendList').innerHTML=d.map(f=>`<div class="friend-card">${profileMini(f.user)}<div class="friend-actions">${f.status==='pending'&&f.direction==='incoming'?`<button data-accept-friend="${f.id}">承認</button>`:''}${f.status==='accepted'?`<button data-dm-user="${f.user.id}" data-dm-name="${esc(f.user.name)}">MESSAGE</button>`:''}<small>${f.status==='accepted'?'FRIEND':f.direction==='incoming'?'申請を受信':'申請中'}</small></div></div>`).join('')||'<p class="system-note">まだフレンドはいません。</p>'}catch(e){}}
async function openDm(){if(!dmUser)return;dmSig='';$('#dmName').textContent=dmUser.name;$('#dmBox').classList.remove('hidden');await loadDm()}async function loadDm(){if(!dmUser)return;try{const d=await api('/api/friends/'+dmUser.id+'/messages');const sig=JSON.stringify(d.map(m=>[m.id,m.senderId,m.message,m.createdAt]));if(sig===dmSig)return;dmSig=sig;const box=$('#dmMessages');const near=box.scrollHeight-box.scrollTop-box.clientHeight<100;const oldTop=box.scrollTop;box.innerHTML=d.map(m=>`<div class="dm-msg ${m.senderId===dmUser.id?'other':'mine'}"><span>${esc(m.message)}</span></div>`).join('');if(near)box.scrollTop=box.scrollHeight;else box.scrollTop=oldTop}catch(e){}}$('#dmSend').onclick=async()=>{const m=$('#dmInput').value.trim();if(!m||!dmUser)return;try{await api('/api/friends/'+dmUser.id+'/messages',{method:'POST',body:JSON.stringify({message:m})});$('#dmInput').value='';loadDm()}catch(e){alert(e.message)}};$('#dmClose').onclick=()=>{$('#dmBox').classList.add('hidden');dmUser=null};setInterval(()=>{if(dmUser)loadDm()},1800);
async function loadLive(){try{const d=await api('/api/live-matches');const all=[...d.quick.map(m=>({k:'quick',m})),...d.custom.map(m=>({k:'custom',m}))];const sig=JSON.stringify(all.map(({k,m})=>[k,m.id,m.gameType,m.status,m.wager,m.challenger?.id,m.challenger?.name,m.opponent?.id,m.opponent?.name]));if(sig===liveSig)return;liveSig=sig;$('#liveList').innerHTML=all.map(({k,m})=>`<a class="live-match-card" href="${k==='quick'?'/watch?kind=quick&id='+m.id:'#'}"><div><b>${k==='quick'?m.gameType.toUpperCase():'CUSTOM'}</b><strong>${esc(m.challenger.name)} <i>VS</i> ${esc(m.opponent.name)}</strong></div><span>${m.wager}pt<br>WATCH</span></a>`).join('')||'<p class="system-note">現在進行中の試合はありません。</p>'}catch(e){}};setInterval(()=>{if(!$('#chat').classList.contains('hidden'))loadChat()},2500);setInterval(()=>{if(!$('#live').classList.contains('hidden'))loadLive()},3000);loadChat();loadFriends();loadLive();window.addEventListener('pointerdown',()=>window.NexusBGM?.prime?.('home'),{once:true});
</script></body></html>
