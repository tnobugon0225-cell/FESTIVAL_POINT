<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030712"><title>ADMIN CONSOLE | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"></head><body class="admin-page">
<div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="scanline"></div></div>
<nav class="topbar"><a href="/" class="brand-mini">← PLAYER</a><strong class="console-title">NEXUS:ZERO / ADMIN CONSOLE</strong></nav><main class="app-shell admin-shell">
<section id="staffLogin" class="system-panel auth-panel"><div class="logo-stage compact-logo"><img src="/nexus-zero-logo.webp" alt="NEXUS:ZERO" class="main-logo"><p class="battle-copy">奪え。守れ。生き残れ。</p></div><div class="eyebrow">AUTHORIZED ACCESS</div><h1>STAFF LOGIN</h1><label>STAFF ID</label><input id="staffUser" autocomplete="username"><label>PASSWORD</label><input id="staffPassword" type="password" autocomplete="current-password"><button id="staffLoginBtn" class="primary-action">ACCESS CONSOLE</button><p id="staffLoginMsg" class="error"></p></section>
<section id="panel" class="hidden">
<div class="system-panel console-status"><div class="user-head"><div><div class="eyebrow">OPERATOR ONLINE</div><h1 id="staffName"></h1></div><div class="admin-actions"><button id="staffRefreshBtn" class="secondary compact">今すぐ更新</button><button id="staffLogoutBtn" class="ghost compact">ログアウト</button></div></div><p id="actionMsg"></p></div>
<div class="admin-grid">
<div class="system-panel"><div class="eyebrow">PLAYER CREATE</div><h2>参加者アカウント作成</h2><div class="split"><div><label>参加者名</label><input id="newParticipantUser" maxlength="20" placeholder="PLAYER NAME"></div><div><label>初期パスワード</label><input id="newParticipantPassword" type="password" maxlength="72" placeholder="6文字以上"></div></div><button id="createParticipantBtn" class="success">参加者を作成</button><div id="participantCreateResult"></div></div>
<div class="system-panel"><div class="eyebrow">PLAYER SEARCH</div><h2>参加者を呼び出す</h2><label>名前 / 4桁ID</label><input id="search" placeholder="例：ノノンガ / 0042"><div id="users"></div></div>
</div>
<div class="system-panel"><div class="eyebrow">POINT CONTROL</div><h2>スタッフ操作：ポイント移動</h2><div class="transfer-box"><div class="split"><div><label>移動元</label><select id="fromUser"></select></div><div><label>移動先</label><select id="toUser"></select></div></div><div class="split"><div><label>ポイント</label><input id="transferAmount" type="number" inputmode="numeric" min="1" placeholder="POINT"></div><div><label>理由</label><input id="transferReason" maxlength="80" placeholder="例：運営判定"></div></div><button id="transferBtn" class="primary-action">ポイントを移動する</button></div></div>
<div class="system-panel"><div class="eyebrow">SYSTEM LOG</div><h2>最新の操作履歴</h2><div id="history"></div></div>
<div id="staffAccountsCard" class="system-panel hidden"><div class="eyebrow">ADMIN ONLY</div><h2>スタッフアカウント</h2><div class="split"><div><label>新規スタッフID</label><input id="newStaffUser" maxlength="30"></div><div><label>権限</label><select id="newStaffRole"><option value="staff">スタッフ</option><option value="admin">管理者</option></select></div></div><label>初期パスワード</label><input id="newStaffPassword" type="password" maxlength="72" placeholder="8文字以上"><button id="createStaffBtn" class="success">スタッフを追加</button><p id="staffAccountMsg"></p><div id="staffList"></div></div>
</section></main><script>
const $=s=>document.querySelector(s);let meStaff=null,allUsers=[],staffAutoTimer=null;
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信に失敗しました');return d}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function fmt(s){if(!s)return '';const v=String(s);return new Date(v.includes('T')?v:v.replace(' ','T')+'Z').toLocaleString('ja-JP')}function avatarSrc(key){return `/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(String(key||''))?key:'avatar-01'}.webp`}

function setMsg(msg,err=false){$('#actionMsg').className=err?'error':'ok';$('#actionMsg').textContent=msg}
async function refreshAll(showMessage=true){await loadUsers();await loadHistory();if(meStaff&&meStaff.role==='admin')await loadStaffAccounts();if(showMessage)setMsg('スタッフ画面を更新しました')}
function startStaffAutoRefresh(){clearInterval(staffAutoTimer);staffAutoTimer=setInterval(()=>{const tag=document.activeElement?.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag))return;refreshAll(false).catch(()=>{})},5000)}
async function check(){const s=await api('/api/staff/status');$('#staffLogin').classList.toggle('hidden',s.loggedIn);$('#panel').classList.toggle('hidden',!s.loggedIn);if(s.loggedIn){meStaff=s.staff;$('#staffName').textContent=`${s.staff.username} / ${s.staff.role==='admin'?'ADMIN':'STAFF'}`;$('#staffAccountsCard').classList.toggle('hidden',s.staff.role!=='admin');await loadUsers();await loadHistory();if(s.staff.role==='admin')await loadStaffAccounts();startStaffAutoRefresh()}else{clearInterval(staffAutoTimer);staffAutoTimer=null}}
async function loadUsers(){const params=new URLSearchParams();const q=$('#search').value.trim();const code=new URLSearchParams(location.search).get('code');if(code&&!q)params.set('code',code);else if(q)params.set('q',q);if(!code&&!q){$('#users').innerHTML='<p class="muted">名前またはIDを入力すると参加者が表示されます。</p>'}else{const shown=await api('/api/staff/users?'+params);$('#users').innerHTML=shown.length?shown.map(u=>`<div class="user"><div class="user-head"><div class="user-head-main"><img class="user-avatar" src="${avatarSrc(u.avatar_key)}" alt=""><div><strong>${esc(u.username)}</strong><div class="customer-number small">ID ${esc(u.public_code)}</div></div></div><span class="badge">${u.points.toLocaleString()} pt</span></div><div class="row"><input id="delta-${u.id}" type="number" inputmode="numeric" min="1" placeholder="POINT"><input id="reason-${u.id}" maxlength="80" placeholder="理由"></div><div class="row"><button onclick="changePoints(${u.id},1)">＋ 加算</button><button class="danger" onclick="changePoints(${u.id},-1)">－ 減算</button></div>${meStaff&&meStaff.role==='admin'?`<div class="row"><button class="secondary" onclick="showParticipantPassword(${u.id},'${encodeURIComponent(u.username)}')">パスワード表示</button><button class="secondary" onclick="resetParticipantPassword(${u.id},'${encodeURIComponent(u.username)}')">パスワード再設定</button></div><button class="delete-user" onclick="deleteUser(${u.id},'${encodeURIComponent(u.username)}')">参加者を削除</button>`:''}</div>`).join(''):'<p class="muted">該当する参加者はいません。</p>';if(code&&shown[0]){history.replaceState({},'', '/admin')}}allUsers=await api('/api/staff/users?all=1');const opts='<option value="">選択してください</option>'+allUsers.map(u=>`<option value="${u.id}">${esc(u.username)} / ${esc(u.public_code)} (${u.points.toLocaleString()}pt)</option>`).join('');const fromValue=$('#fromUser').value,toValue=$('#toUser').value;$('#fromUser').innerHTML=opts;$('#toUser').innerHTML=opts;if([...$('#fromUser').options].some(o=>o.value===fromValue))$('#fromUser').value=fromValue;if([...$('#toUser').options].some(o=>o.value===toValue))$('#toUser').value=toValue}
async function changePoints(id,sign){const raw=Number($(`#delta-${id}`).value),delta=Math.abs(raw)*sign,reason=$(`#reason-${id}`).value;if(!Number.isInteger(delta)||delta===0)return setMsg('整数のポイントを入力してください',true);try{const u=await api(`/api/staff/users/${id}/points`,{method:'POST',body:JSON.stringify({delta,reason})});if(u.eliminated)setMsg(`${u.username} は0ptになったため自動退場しました`);else setMsg(`${u.username}：${delta>0?'+':''}${delta.toLocaleString()} pt → 現在 ${u.points.toLocaleString()} pt`);await loadUsers();loadHistory()}catch(e){setMsg(e.message,true)}}
window.deleteUser=async(id,nameEncoded)=>{const name=decodeURIComponent(nameEncoded);if(!confirm(`${name} のアカウントを完全に削除します。よろしいですか？`))return;try{const r=await api(`/api/staff/users/${id}`,{method:'DELETE'});setMsg(`${r.username} を削除しました`);await loadUsers();loadHistory()}catch(e){setMsg(e.message,true)}};
window.showParticipantPassword=async(id,nameEncoded)=>{const name=decodeURIComponent(nameEncoded);try{const r=await api(`/api/staff/users/${id}/password`);if(!r.available)return alert(`${name} の保存済みパスワードはありません。\n「パスワード再設定」から新しいパスワードを設定してください。`);alert(`${name} の現在のパスワード\n\n${r.password}\n\nこの情報は参加者本人以外に共有しないでください。`)}catch(e){setMsg(e.message,true)}};
window.resetParticipantPassword=async(id,nameEncoded)=>{const name=decodeURIComponent(nameEncoded);const password=prompt(`${name} の新しいパスワードを入力してください（6文字以上）`);if(password===null)return;if(password.length<6)return setMsg('パスワードは6文字以上で入力してください',true);try{const r=await api(`/api/staff/users/${id}/password`,{method:'POST',body:JSON.stringify({password})});setMsg(`${r.username} のパスワードを再設定しました`);alert(`新しいパスワード：${r.password}`);await loadUsers()}catch(e){setMsg(e.message,true)}};
$('#transferBtn').onclick=async()=>{try{const fromId=Number($('#fromUser').value),toId=Number($('#toUser').value),amount=Number($('#transferAmount').value),reason=$('#transferReason').value;if(!fromId||!toId)return setMsg('移動元と移動先を選択してください',true);const r=await api('/api/staff/transfer',{method:'POST',body:JSON.stringify({fromId,toId,amount,reason})});setMsg(r.eliminated?`${r.from.username} → ${r.to.username} に ${amount.toLocaleString()}pt移動。${r.from.username}は0ptで退場しました`:`${r.from.username} → ${r.to.username} に ${amount.toLocaleString()} pt 移動しました`);await loadUsers();loadHistory()}catch(e){setMsg(e.message,true)}}
async function loadHistory(){const h=await api('/api/staff/history');$('#history').innerHTML=h.length?h.map(x=>{let move=x.action_type.includes('transfer_out')?` → ${esc(x.counterpart||'相手')}`:x.action_type.includes('transfer_in')?` ← ${esc(x.counterpart||'相手')}`:'';const source=x.action_type.startsWith('participant_')?'PLAYER':'STAFF';return `<div class="history-item"><div><div class="history-type">${source}</div><strong>${esc(x.username)}</strong>：<strong class="delta ${x.delta>0?'plus':'minus'}">${x.delta>0?'+':''}${x.delta.toLocaleString()} pt</strong>${move}${x.reason?`<div class="reason">${esc(x.reason)}</div>`:''}</div><div class="muted small">${x.staff_name?`操作: ${esc(x.staff_name)} / `:''}${fmt(x.created_at)}</div></div>`}).join(''):'<p class="muted">履歴はまだありません。</p>'}
async function loadStaffAccounts(){const rows=await api('/api/staff/accounts');$('#staffList').innerHTML=rows.map(s=>`<div class="staff-chip"><div><strong>${esc(s.username)}</strong> <span class="badge">${s.role==='admin'?'ADMIN':'STAFF'}</span><div class="muted small">${s.active?'有効':'無効'}</div></div>${s.id===meStaff.id?'':`<button class="secondary compact" onclick="toggleStaff(${s.id})">${s.active?'無効化':'有効化'}</button>`}</div>`).join('')}
window.toggleStaff=async id=>{try{await api(`/api/staff/accounts/${id}/toggle`,{method:'POST'});loadStaffAccounts()}catch(e){$('#staffAccountMsg').className='error';$('#staffAccountMsg').textContent=e.message}};
$('#createStaffBtn').onclick=async()=>{try{await api('/api/staff/accounts',{method:'POST',body:JSON.stringify({username:$('#newStaffUser').value,password:$('#newStaffPassword').value,role:$('#newStaffRole').value})});$('#staffAccountMsg').className='ok';$('#staffAccountMsg').textContent='スタッフを追加しました';$('#newStaffUser').value='';$('#newStaffPassword').value='';loadStaffAccounts()}catch(e){$('#staffAccountMsg').className='error';$('#staffAccountMsg').textContent=e.message}};
$('#createParticipantBtn').onclick=async()=>{const box=$('#participantCreateResult');box.className='';box.innerHTML='';try{const r=await api('/api/staff/participants',{method:'POST',body:JSON.stringify({username:$('#newParticipantUser').value,password:$('#newParticipantPassword').value})});box.className='ok';box.innerHTML=`<div class="user"><strong>${esc(r.username)} を作成しました</strong><div class="customer-number">ID ${esc(r.code)}</div><div class="muted small">初期ポイント：${r.startingPoints} pt</div><div class="muted small">初期パスワード：<strong>${esc(r.password)}</strong></div><div class="muted small">このIDとパスワードを参加者へ案内してください。</div></div>`;$('#search').value=r.username;$('#newParticipantUser').value='';$('#newParticipantPassword').value='';await loadUsers()}catch(e){box.className='error';box.textContent=e.message}};
$('#staffRefreshBtn').onclick=()=>refreshAll(true).catch(e=>setMsg(e.message,true));$('#staffLoginBtn').onclick=async()=>{try{await api('/api/staff/login',{method:'POST',body:JSON.stringify({username:$('#staffUser').value,password:$('#staffPassword').value})});$('#staffPassword').value='';check()}catch(e){$('#staffLoginMsg').textContent=e.message}};$('#staffLogoutBtn').onclick=async()=>{clearInterval(staffAutoTimer);await api('/api/staff/logout',{method:'POST'});location.reload()};let t;$('#search').oninput=()=>{clearTimeout(t);t=setTimeout(()=>loadUsers().catch(e=>setMsg(e.message,true)),250)};check();
</script></body></html>
