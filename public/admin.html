<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタッフ管理 | FESTIVAL POINTS</title><link rel="stylesheet" href="/style.css"></head><body>
<nav><a href="/">← 参加者画面</a><strong>STAFF CONSOLE</strong></nav><main>
<section id="staffLogin" class="card"><h1>スタッフログイン</h1><p class="muted">スタッフごとのIDでログインしてください。</p><label>スタッフID</label><input id="staffUser" autocomplete="username"><label>パスワード</label><input id="staffPassword" type="password" autocomplete="current-password"><button id="staffLoginBtn">ログイン</button><p id="staffLoginMsg" class="error"></p></section>
<section id="panel" class="hidden">
<div class="card"><div class="user-head"><div><p class="muted small" style="margin:0">ログイン中</p><h1 id="staffName" style="margin:0"></h1></div><button id="staffLogoutBtn" class="secondary" style="width:auto;margin:0">ログアウト</button></div><p id="actionMsg" class="ok"></p></div>
<div class="card"><h2>参加者を呼び出す</h2><p class="muted">名前で検索するか、参加者QRをスマホのカメラで読み取ってこの画面を開いてください。</p><label>参加者検索</label><input id="search" placeholder="ニックネーム"><div id="users"></div></div>
<div class="card"><h2>ポイント移動 / 奪取</h2><p class="muted">移動元から減らし、移動先へ同じポイントを加算します。合計ポイントは変わりません。</p><div class="transfer-box"><div class="split"><div><label>移動元</label><select id="fromUser"></select></div><div><label>移動先</label><select id="toUser"></select></div></div><label>ポイント</label><input id="transferAmount" type="number" inputmode="numeric" value="100" min="1"><label>理由</label><input id="transferReason" maxlength="100" placeholder="例：対戦勝利"><button id="transferBtn">ポイントを移動する</button></div></div>
<div class="card"><h2>最新の操作履歴</h2><div id="history"></div></div>
<div id="staffAccountsCard" class="card hidden"><h2>スタッフアカウント</h2><p class="muted">管理者だけがスタッフを追加・無効化できます。</p><div class="split"><div><label>新規スタッフID</label><input id="newStaffUser" maxlength="30"></div><div><label>権限</label><select id="newStaffRole"><option value="staff">スタッフ</option><option value="admin">管理者</option></select></div></div><label>初期パスワード</label><input id="newStaffPassword" type="password" maxlength="72" placeholder="8文字以上"><button id="createStaffBtn" class="success">スタッフを追加</button><p id="staffAccountMsg"></p><div id="staffList"></div></div>
</section></main>
<script>
const $=s=>document.querySelector(s);let meStaff=null,allUsers=[];
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信に失敗しました');return d}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function fmt(s){return s?new Date(s.replace(' ','T')+'Z').toLocaleString('ja-JP'):''}
function setMsg(msg,err=false){$('#actionMsg').className=err?'error':'ok';$('#actionMsg').textContent=msg}
async function check(){const s=await api('/api/staff/status');$('#staffLogin').classList.toggle('hidden',s.loggedIn);$('#panel').classList.toggle('hidden',!s.loggedIn);if(s.loggedIn){meStaff=s.staff;$('#staffName').textContent=`${s.staff.username} (${s.staff.role==='admin'?'管理者':'スタッフ'})`;$('#staffAccountsCard').classList.toggle('hidden',s.staff.role!=='admin');await loadUsers();await loadHistory();if(s.staff.role==='admin')loadStaffAccounts()} }
async function loadUsers(){const params=new URLSearchParams();const q=$('#search').value.trim();const code=new URLSearchParams(location.search).get('code');if(code&&!q)params.set('code',code);else if(q)params.set('q',q);const shown=await api('/api/staff/users?'+params);$('#users').innerHTML=shown.length?shown.map(u=>`<div class="user"><div class="user-head"><div><strong>${esc(u.username)}</strong><div class="muted small code">${esc(u.public_code)}</div></div><span class="badge">${u.points.toLocaleString()} pt</span></div><div class="row"><input id="delta-${u.id}" type="number" inputmode="numeric" value="100" min="1"><input id="reason-${u.id}" maxlength="100" placeholder="理由（例：ゲームクリア）"></div><div class="row"><button onclick="changePoints(${u.id},1)">＋ 加算</button><button class="danger" onclick="changePoints(${u.id},-1)">－ 減算</button></div></div>`).join(''):'<p class="muted">該当する参加者はいません。</p>';allUsers=await api('/api/staff/users');const opts='<option value="">選択してください</option>'+allUsers.map(u=>`<option value="${u.id}">${esc(u.username)} (${u.points.toLocaleString()}pt)</option>`).join('');$('#fromUser').innerHTML=opts;$('#toUser').innerHTML=opts;if(code&&shown[0]){$('#fromUser').value=shown[0].id;history.replaceState({},'', '/admin')}}
async function changePoints(id,sign){const raw=Number($(`#delta-${id}`).value),delta=Math.abs(raw)*sign,reason=$(`#reason-${id}`).value;if(!Number.isInteger(delta)||delta===0)return setMsg('整数のポイントを入力してください',true);try{const u=await api(`/api/staff/users/${id}/points`,{method:'POST',body:JSON.stringify({delta,reason})});setMsg(`${u.username}：${delta>0?'+':''}${delta.toLocaleString()} pt → 現在 ${u.points.toLocaleString()} pt`);await loadUsers();loadHistory()}catch(e){setMsg(e.message,true)}}
$('#transferBtn').onclick=async()=>{try{const fromId=Number($('#fromUser').value),toId=Number($('#toUser').value),amount=Number($('#transferAmount').value),reason=$('#transferReason').value;if(!fromId||!toId)return setMsg('移動元と移動先を選択してください',true);const r=await api('/api/staff/transfer',{method:'POST',body:JSON.stringify({fromId,toId,amount,reason})});setMsg(`${r.from.username} → ${r.to.username} に ${amount.toLocaleString()} pt 移動しました`);await loadUsers();loadHistory()}catch(e){setMsg(e.message,true)}}
async function loadHistory(){const h=await api('/api/staff/history');$('#history').innerHTML=h.length?h.map(x=>{let move=x.action_type==='transfer_out'?` → ${esc(x.counterpart||'相手')}`:x.action_type==='transfer_in'?` ← ${esc(x.counterpart||'相手')}`:'';return `<div class="history-item"><div><strong>${esc(x.username)}</strong>：<strong>${x.delta>0?'+':''}${x.delta.toLocaleString()} pt</strong>${move}${x.reason?` <span class="muted">(${esc(x.reason)})</span>`:''}</div><div class="muted small">操作: ${esc(x.staff_name||'旧データ')} / ${fmt(x.created_at)}</div></div>`}).join(''):'<p class="muted">履歴はまだありません。</p>'}
async function loadStaffAccounts(){const rows=await api('/api/staff/accounts');$('#staffList').innerHTML=rows.map(s=>`<div class="staff-chip"><div><strong>${esc(s.username)}</strong> <span class="badge">${s.role==='admin'?'管理者':'スタッフ'}</span><div class="muted small">${s.active?'有効':'無効'}</div></div>${s.id===meStaff.id?'':`<button class="secondary" style="width:auto;margin:0" onclick="toggleStaff(${s.id})">${s.active?'無効化':'有効化'}</button>`}</div>`).join('')}
window.toggleStaff=async id=>{try{await api(`/api/staff/accounts/${id}/toggle`,{method:'POST'});loadStaffAccounts()}catch(e){$('#staffAccountMsg').className='error';$('#staffAccountMsg').textContent=e.message}};
$('#createStaffBtn').onclick=async()=>{try{await api('/api/staff/accounts',{method:'POST',body:JSON.stringify({username:$('#newStaffUser').value,password:$('#newStaffPassword').value,role:$('#newStaffRole').value})});$('#staffAccountMsg').className='ok';$('#staffAccountMsg').textContent='スタッフを追加しました';$('#newStaffUser').value='';$('#newStaffPassword').value='';loadStaffAccounts()}catch(e){$('#staffAccountMsg').className='error';$('#staffAccountMsg').textContent=e.message}};
$('#staffLoginBtn').onclick=async()=>{try{await api('/api/staff/login',{method:'POST',body:JSON.stringify({username:$('#staffUser').value,password:$('#staffPassword').value})});$('#staffPassword').value='';check()}catch(e){$('#staffLoginMsg').textContent=e.message}};$('#staffLogoutBtn').onclick=async()=>{await api('/api/staff/logout',{method:'POST'});location.reload()};let t;$('#search').oninput=()=>{clearTimeout(t);t=setTimeout(()=>loadUsers().catch(e=>setMsg(e.message,true)),250)};check();
</script></body></html>
