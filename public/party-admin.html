<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARTY ADMIN</title><style>body{background:#0b1425;color:#fff;font:16px system-ui;max-width:760px;margin:auto;padding:20px}section{border:1px solid #3a5472;border-radius:12px;padding:20px;margin:20px 0}button{padding:10px 18px;background:#165475;color:white;border:0;border-radius:8px;margin:5px;cursor:pointer}.item{border-bottom:1px solid #345;padding:15px 0}a{color:#9de}</style></head><body><a href="/admin">← 管理画面</a><h1>パーティー申請管理</h1><p id="msg"></p><section><h2>大会期間のメンバー固定</h2><p id="lock"></p><button onclick="setLock(true)">変更をロック</button><button onclick="setLock(false)">ロック解除</button></section><section><h2>審査待ちの申請</h2><div id="items"></div></section><script>
async function api(p,o={}){const r=await fetch('/api/party'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'エラー');return d}async function send(p,b){return api(p,{method:'POST',body:JSON.stringify(b)})}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}async function refresh(){try{const [a,l]=await Promise.all([api('/staff/applications'),api('/staff/lock')]);document.getElementById('lock').textContent=l.locked?'現在：ロック中':'現在：変更可能';document.getElementById('items').innerHTML=a.map(x=>`<div class="item"><b>${esc(x.name)}</b><p>申請者：${esc(x.applicant_name)}</p><p>${x.member_names.map(esc).join(' / ')}</p><button onclick="review(${Number(x.id)},'approve')">承認</button><button onclick="review(${Number(x.id)},'reject')">却下</button></div>`).join('')||'申請はありません'}catch(e){document.getElementById('msg').textContent=e.message}}async function review(id,d){if(!confirm(d==='approve'?'この3人でパーティーを結成しますか？':'申請を却下しますか？'))return;try{await send('/staff/applications/'+id+'/'+d,{});await refresh()}catch(e){alert(e.message)}}async function setLock(v){try{await send('/staff/lock',{locked:v});await refresh()}catch(e){alert(e.message)}}refresh();</script></body></html>
