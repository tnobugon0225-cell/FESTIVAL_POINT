<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>PARTY | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css?v=party-layout-20261013-2"><script src="/bgm.js" defer></script><script src="/ui-fx.js?v=party-fullname-authguard-20261014" defer></script>
<style>
/* Party-only controls: keep the site's cyber panels, topbar and typography. */
.party-page .party-shell{max-width:1100px;margin:0 auto}
.party-page .party-hero{text-align:center;margin-bottom:20px}
.party-page .party-hero h1{font-size:clamp(32px,6vw,52px);letter-spacing:.12em;margin:12px 0 16px}
.party-page .party-panel{margin:0 0 20px;padding:clamp(18px,4vw,32px)}
.party-page .party-panel h2{font-size:clamp(20px,4vw,27px);letter-spacing:.04em;margin:0 0 18px}
.party-page .party-panel h3{margin:24px 0 12px;font-size:17px;color:#e5faff}
.party-page .party-panel label{display:block;color:#9bc9e6;margin:17px 0 7px;font-weight:750}
.party-page .party-panel input{display:block;width:100%;min-width:0;max-width:100%;padding:14px 16px;margin:0 0 12px;background:rgba(3,13,28,.82);color:#effbff;border:1px solid rgba(82,175,239,.4);border-radius:8px;font:inherit;box-sizing:border-box}
.party-page .party-panel input:focus{outline:2px solid #55d5ff;outline-offset:1px}
.party-page .party-panel button{display:inline-flex;justify-content:center;align-items:center;gap:8px;max-width:100%;min-height:43px;padding:10px 18px;margin:8px 0 0;background:linear-gradient(105deg,#076fe5,#4b4af0);border:1px solid rgba(105,193,255,.42);border-radius:8px;color:#fff;font:inherit;font-weight:800;cursor:pointer}
.party-page .party-panel button.danger{background:linear-gradient(100deg,#832a49,#bd3157);border-color:#a94359}
.party-page .party-panel button:disabled{opacity:.45;cursor:not-allowed}
.party-page .party-panel .hidden{display:none!important}
.party-page .party-panel .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.party-page .party-panel .metric{padding:18px 6px;text-align:center;background:rgba(28,71,111,.24);border:1px solid rgba(70,177,240,.22);border-radius:8px}
.party-page .party-panel .metric strong{display:block;font-size:clamp(17px,4.2vw,27px);margin:7px 0;color:#f1faff;overflow-wrap:anywhere}
.party-page .party-panel .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:13px 0;border-bottom:1px solid rgba(80,174,229,.22)}
.party-page .party-panel .row:last-child{border-bottom:0}
.party-page .party-panel .actions{display:flex;flex-wrap:wrap;gap:8px}
.party-page .party-panel .actions button{margin:0;padding:8px 12px;min-height:36px}
.party-page .party-panel .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}
.party-page .party-panel .tabs button{width:100%;margin:0;padding:12px 4px;min-width:0;font-size:clamp(11px,3vw,15px);background:rgba(9,35,61,.8)}
.party-page .party-panel .tabs button.selected{background:linear-gradient(105deg,#076fe5,#4b4af0);border-color:#78dfff}
.party-page .party-panel .tab{padding:8px 0 4px}
.party-page .party-panel .chat{height:270px;overflow:auto;background:rgba(1,12,27,.8);border:1px solid rgba(76,168,229,.22);border-radius:8px;padding:12px}
.party-page .party-panel .bubble{letter-spacing:0!important;word-spacing:normal!important;line-height:1.6;background:rgba(32,77,117,.45);border-radius:8px;padding:10px;margin:8px 0;overflow-wrap:anywhere}
.party-page .party-panel .bubble small{display:block;color:#a4cbe3;letter-spacing:0!important;word-spacing:normal!important;font-kerning:normal}
.party-page .party-panel .pill{border:1px solid rgba(89,198,250,.3);border-radius:20px;padding:4px 10px;color:#9edbff;font-size:12px}
.party-page #notice{min-height:0;margin:0;color:#65e5bc}
.party-page #notice:not(:empty){padding:12px 16px;margin-bottom:18px;border:1px solid rgba(79,199,171,.35);background:rgba(15,81,69,.15)}
.party-page #notice.error{color:#ff9aaf}
@media(max-width:480px){.party-page .party-panel .metric{padding:13px 3px}.party-page .party-panel .metric .muted{font-size:10px}.party-page .party-panel .actions button{font-size:12px}}
.party-page .party-member-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 18px}
.party-page .party-member-picker button{min-width:0;width:100%;margin:0;padding:11px 4px;overflow-wrap:anywhere;background:rgba(9,35,61,.8)}
.party-page .party-member-picker button.selected{background:linear-gradient(105deg,#076fe5,#4b4af0);border-color:#78dfff}
.party-member-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(80,174,229,.25)}
.party-member-summary>div{display:flex;flex-direction:column;gap:4px}.party-member-summary>div:last-child{text-align:right}
.party-member-summary strong{font-size:18px}.party-member-summary small,.party-member-overall small{font-size:12px;color:#9bc9e6}
.party-member-overall{display:flex;align-items:center;gap:12px;padding:18px 0;flex-wrap:wrap}.party-member-overall strong{font-size:23px}.party-member-overall small{margin-left:auto}
.game-stats{border:1px solid rgba(82,175,239,.28);border-radius:10px;overflow:hidden;margin:10px 0}
.game-stat-head,.game-stat-row{display:grid;grid-template-columns:minmax(0,1.45fr) .65fr 1fr;gap:6px;align-items:center;padding:12px 9px}
.game-stat-head{background:rgba(23,73,115,.3);font-size:11px;color:#9bc9e6}
.game-stat-row{border-top:1px solid rgba(82,175,239,.16);font-size:13px}.game-stat-row strong{white-space:nowrap;font-size:16px}.game-stat-row small{white-space:nowrap;color:#bedcf0;font-size:12px}
.game-stat-row.is-total{background:rgba(23,73,115,.25);font-weight:800}.member-manage{margin-top:16px}
</style></head><body class="player-page v52-player party-page">
<div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="cyber-orbit orbit-b"></div><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/" data-nexus-nav="HOME"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><a href="/" data-nexus-nav="HOME">HOME</a><a href="/rule" data-nexus-nav="RULE">RULE</a><a href="/ranking" data-nexus-nav="RANKING">RANKING</a><a class="active" href="/party" data-nexus-nav="PARTY">PARTY</a><a href="/history" data-nexus-nav="HISTORY">HISTORY</a><a href="/support.html" data-nexus-nav="CONTACT">CONTACT</a></div></nav>
<main class="app-shell arena-shell party-shell"><div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button type="button" id="partyRefreshBtn" style="padding:10px 20px;border:1px solid #5abdf4;border-radius:8px;background:#102744;color:#e9faff;font-weight:800;cursor:pointer">↻ パーティー情報を更新</button></div>
<section class="ranking-hero system-panel party-hero"><div class="eyebrow">NEXUS:ZERO / PARTY SYSTEM</div><h1>PARTY</h1><p class="muted">仲間と挑む、3人のチームバトル。</p></section>
<p id="notice" aria-live="polite"></p>
<section id="mine" class="system-panel party-panel hidden"><div class="eyebrow">YOUR PARTY</div><h2 id="pname"></h2><div class="grid"><div class="metric"><span class="muted">RANK</span><strong id="prank">—</strong></div><div class="metric"><span class="muted">POINTS</span><strong id="ppoints">0</strong></div><div class="metric"><span class="muted">WIN RATE</span><strong id="prate">—</strong></div></div><div class="tabs"><button type="button" onclick="tab('members')">MEMBERS</button><button type="button" onclick="tab('chat')">CHAT</button><button type="button" onclick="tab('stats')">RECORD</button></div><div id="members" class="tab"></div><div id="chat" class="tab hidden"><div id="messages" class="chat"></div><form id="chatForm"><input id="message" maxlength="120" placeholder="メッセージ（120文字以内）" required><button>送信</button></form></div><div id="stats" class="tab hidden"></div><div id="leaderTools" class="hidden"><h3>LEADER CONTROL</h3><p class="muted" id="lockNotice"></p><form id="inviteForm"><label>メンバーを招待</label><input id="inviteCode" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" placeholder="招待するPLAYER ID" required><button class="roster">招待を送る</button></form><button id="disband" class="danger roster">パーティーを解散</button></div></section>
<section id="unaffiliated" class="system-panel party-panel hidden"><div class="eyebrow">PARTY APPLICATION</div><h2>パーティー結成申請</h2><p class="muted">申請者本人を含む3人のPLAYER IDを入力してください。残り2人の承認が揃うと運営へ申請されます。</p><form id="applyForm"><label>パーティー名</label><input name="name" maxlength="30" minlength="2" required placeholder="パーティー名"><label>リーダー（あなた）の4桁ID</label><input name="code1" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required><label>メンバー2のID</label><input name="code2" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required><label>メンバー3のID</label><input name="code3" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required><button class="roster">結成招待を送る</button></form><h3>申請状況</h3><div id="applications"></div><h3>届いた結成招待</h3><div id="formationInvites"></div><h3>届いたメンバー招待</h3><div id="invites"></div></section>
</main><script>
window.addEventListener('DOMContentLoaded',()=>window.NexusBGM?.setTrack('home'));
const $=id=>document.getElementById(id);let state=null,partyStats=null,selectedMember=null;const token=localStorage.getItem('nexusParticipantToken')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('/api/party'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json','X-Participant-Token':token,Authorization:'Bearer '+token},...options});const data=await r.json();if(!r.ok)throw Error(data.error||'通信エラー');return data}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
function notice(s,error=false){$('notice').textContent=s;$('notice').classList.toggle('error',error)}
async function action(path,body,confirmText){if(confirmText&&!confirm(confirmText))return;try{await post(path,body);notice('操作が完了しました');await refresh()}catch(e){notice(e.message,true)}}
function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('#mine .tabs button').forEach((b,i)=>b.classList.toggle('selected',['members','chat','stats'][i]===t));$('leaderTools').classList.toggle('hidden',t!=='members'||!state?.party||String(state.party.leader_id)!==String(window.myUserId));if(t==='chat')loadChat()}
let refreshingParty=false;async function refresh(){if(refreshingParty)return;refreshingParty=true;const btn=$('partyRefreshBtn');if(btn)btn.disabled=true;try{state=await api('/mine');partyStats=state.party?await api('/stats/'+state.party.id):null;render();return true}catch(e){notice(e.message,true);return false}finally{refreshingParty=false;if(btn)btn.disabled=false}}
function render(){const p=state.party;$('mine').classList.toggle('hidden',!p);$('unaffiliated').classList.toggle('hidden',!!p);const disabled=state.locked?'disabled':'';

if(!p){$('applications').innerHTML=state.applications.map(a=>`<div class="row"><div><strong>${esc(a.name)}</strong><br><span class="pill">${({collecting:'メンバー承認待ち',pending:'運営審査待ち',approved:'結成済み',rejected:'却下・辞退',cancelled:'取り消し'})[a.status]||esc(a.status)}</span>${a.status==='collecting'?`<div class="muted" style="margin-top:8px">${(a.invite_statuses||[]).map(v=>`${esc(v.name)} (#${esc(v.code)}): ${v.status==='accepted'?'承認済み':'回答待ち'}`).join('<br>')}</div>`:''}</div>${['collecting','pending'].includes(a.status)?`<button onclick="action('/applications/${Number(a.id)}/cancel',{},'結成申請を取り消しますか？')">取り消す</button>`:''}</div>`).join('')||'<p class="muted">申請なし</p>';
 $('formationInvites').innerHTML=(state.formationInvites||[]).map(i=>`<div class="row"><span><strong>${esc(i.name)}</strong><br><small class="muted">申請者：${esc(i.applicant_name)}</small></span><div class="actions"><button ${disabled} onclick="action('/applications/${Number(i.id)}/respond',{decision:'accept'})">承認</button><button ${disabled} class="danger" onclick="action('/applications/${Number(i.id)}/respond',{decision:'reject'},'結成招待を拒否しますか？')">拒否</button></div></div>`).join('')||'<p class="muted">結成招待なし</p>';$('invites').innerHTML=state.invites.map(i=>`<div class="row"><span>${esc(i.name)}</span><div class="actions"><button ${disabled} onclick="action('/invites/${Number(i.id)}/accept',{})">承認</button><button ${disabled} onclick="action('/invites/${Number(i.id)}/reject',{})">拒否</button></div></div>`).join('')||'<p class="muted">招待なし</p>';}
else{$('pname').textContent=p.name;$('ppoints').textContent=p.points+' pt';const pt=Number(p.points)||0;$('prank').textContent=(pt>=80?'S':pt>=50?'A':pt>=30?'B':pt>=15?'C':pt>=5?'D':'E')+' RANK';const wins=Number(p.wins),losses=Number(p.losses),draws=Number(p.draws);$('prate').textContent=rate({wins,losses});$('stats').innerHTML=renderGameStats(partyStats?.byGame,true);
const allMembers=state.members||[];
if(!allMembers.some(m=>String(m.id)===String(selectedMember)))selectedMember=allMembers[0]?.id;
$('members').innerHTML=`<div class="party-member-picker">${allMembers.map(m=>`<button type="button" class="${String(m.id)===String(selectedMember)?'selected':''}" onclick="selectMember(${Number(m.id)})">${String(m.id)===String(p.leader_id)?'👑 ':''}${esc(m.username)}</button>`).join('')}</div><div id="memberRecord"></div>`;
renderMemberRecord();
const isLeader=String(p.leader_id)===String(window.myUserId);$('leaderTools').classList.toggle('hidden',!isLeader||document.getElementById('members').classList.contains('hidden'));$('lockNotice').textContent=state.locked?'大会期間中のため、加入・脱退・解散は停止中です。':'';document.querySelectorAll('.roster').forEach(x=>x.disabled=state.locked);}
}
const gameLabels={janken:'ジャンケン',chinchiro:'チンチロ',hitblow:'ヒット＆ブロー',custom:'カスタム対戦',other:'その他'};
const rate=r=>{const w=Number(r?.wins)||0,l=Number(r?.losses)||0;return w+l?Math.round(w/(w+l)*100)+'%':'—'};
function renderGameStats(byGame,total=false){
 const rows=Object.entries(gameLabels).map(([key,label])=>({label,stat:byGame?.[key]||{wins:0,draws:0,losses:0}}));
 const sum=rows.reduce((a,x)=>({wins:a.wins+Number(x.stat.wins),draws:a.draws+Number(x.stat.draws),losses:a.losses+Number(x.stat.losses)}),{wins:0,draws:0,losses:0});
 const row=x=>`<div class="game-stat-row${x.key==='total'?' is-total':''}"><span>${x.label}</span><strong>${rate(x.stat)}</strong><small>${Number(x.stat.wins)} / ${Number(x.stat.draws)} / ${Number(x.stat.losses)}</small></div>`;
 return `<div class="game-stats"><div class="game-stat-head"><span>GAME</span><span>勝率</span><span>勝 / 分 / 敗</span></div>${rows.filter(x=>x.label!=='その他'||x.stat.wins+x.stat.draws+x.stat.losses>0).map(row).join('')}${total?row({key:'total',label:'総合',stat:sum}):''}</div><p class="muted">勝率は引き分けを除いて算出。異なるパーティー間、およびパーティー未所属者との対戦が対象です。同じパーティー内の対戦は対象外です。</p>`;
}
function selectMember(id){selectedMember=id;render();}
function renderMemberRecord(){
 const m=(state?.members||[]).find(x=>String(x.id)===String(selectedMember));if(!m)return;
 const r=partyStats?.players?.find(x=>String(x.userId)===String(m.id));
 const empty={wins:0,draws:0,losses:0,points:0};
 const stat=r||empty;
 const el=$('memberRecord');if(!el)return;
 const isLeader=String(state.party.leader_id)===String(window.myUserId);
 el.innerHTML=`<div class="party-member-summary"><div><strong>${esc(m.username)}</strong><small>${String(m.id)===String(state.party.leader_id)?'LEADER':'MEMBER'}</small></div><div><small>貢献ポイント</small><strong>${Number(stat.points)} pt</strong></div></div><div class="party-member-overall">総合勝率 <strong>${rate(stat)}</strong><small>${Number(stat.wins)}勝 ${Number(stat.draws)}分 ${Number(stat.losses)}敗</small></div>${renderGameStats(r?.byGame)}${isLeader&&String(m.id)!==String(state.party.leader_id)?`<div class="actions member-manage"><button onclick="action('/transfer',{userId:${Number(m.id)}},'リーダー権限を譲渡しますか？')">リーダー譲渡</button><button class="roster" ${state.locked?'disabled':''} onclick="action('/remove',{userId:${Number(m.id)}},'このメンバーを脱退させますか？')">脱退させる</button></div>`:''}`;
}
async function loadChat(){try{const m=await api('/chat');$('messages').innerHTML=m.map(x=>`<div class="bubble"><small>${esc(x.sender_name)} · ${new Date(x.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small>${esc(x.message)}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}catch(e){notice(e.message,true)}}
$('applyForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await action('/apply',{name:f.get('name'),codes:[f.get('code1'),f.get('code2'),f.get('code3')]})};
$('inviteForm').onsubmit=async e=>{e.preventDefault();await action('/invite',{code:$('inviteCode').value})};
$('chatForm').onsubmit=async e=>{e.preventDefault();try{await post('/chat',{message:$('message').value});$('message').value='';await loadChat()}catch(e){notice(e.message,true)}};
$('partyRefreshBtn').onclick=async()=>{notice('最新情報を取得中...');if(await refresh())notice('最新情報に更新しました')};
$('disband').onclick=()=>action('/disband',{},'パーティーを解散します。ポイント・戦績・チャット・大会履歴は消え、復元できません。実行しますか？');
(async()=>{try{const r=await fetch('/api/me',{credentials:'same-origin',headers:{'X-Participant-Token':token,Authorization:'Bearer '+token}});if(r.ok){const d=await r.json();window.myUserId=Number(d.id??d.user?.id);const input=document.querySelector('[name=code1]');input.value=d.public_code??d.user?.public_code??'';}}catch{}await refresh()})();
</script></body></html>
