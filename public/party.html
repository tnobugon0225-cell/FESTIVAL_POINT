<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PARTY | NEXUS:ZERO</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070b18;color:#edf3ff;font-family:system-ui,'Noto Sans JP',sans-serif}main{max-width:800px;margin:auto;padding:22px 16px 70px}a{color:#9be9ff}h1{font-size:30px;letter-spacing:.16em;margin:10px 0 20px}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px}.panel{background:#101b30;border:1px solid #274360;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 10px 24px #0003}.eyebrow{color:#66dbff;letter-spacing:.18em;font-size:11px}.muted{color:#a3b4cc;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:15px 5px;text-align:center;background:#182943;border-radius:12px}.metric strong{display:block;font-size:24px;margin:6px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #294059;padding:11px 0}.row:last-child{border:0}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #355773;background:#0b162a;color:white;min-width:0}input{width:100%;margin:5px 0 10px}button{cursor:pointer;background:#154767;border-color:#337b9f}button:hover{background:#216184}button:disabled{opacity:.4;cursor:not-allowed}.danger{background:#62273a;border-color:#a94359}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.hidden{display:none!important}.chat{height:270px;overflow:auto;background:#071222;border-radius:10px;padding:12px}.bubble{background:#1b304a;border-radius:10px;padding:9px;margin:7px 0;word-break:break-word}.bubble small{display:block;color:#86a9c9}.tabs{display:flex;gap:8px}.tabs button{flex:1}.pill{border-radius:20px;padding:3px 10px;background:#283e58;font-size:12px}#notice{min-height:25px;color:#77e6c7}#notice.error{color:#ff9aaf}@media(max-width:500px){.panel{padding:14px}.metric strong{font-size:20px}}
</style></head><body><main><a href="/">← HOME</a><p class="eyebrow">NEXUS:ZERO / PARTY SYSTEM</p><h1>PARTY</h1><p id="notice" aria-live="polite"></p>
<section id="mine" class="panel hidden"><p class="eyebrow">YOUR PARTY</p><h2 id="pname"></h2><div class="grid"><div class="metric"><span class="muted">RANK</span><strong id="prank">—</strong></div><div class="metric"><span class="muted">POINTS</span><strong id="ppoints">0</strong></div><div class="metric"><span class="muted">WIN RATE</span><strong id="prate">—</strong></div></div><div class="tabs" style="margin-top:18px"><button onclick="tab('members')">MEMBERS</button><button onclick="tab('chat')">CHAT</button><button onclick="tab('stats')">RECORD</button></div><div id="members" class="tab"></div><div id="chat" class="tab hidden"><div id="messages" class="chat"></div><form id="chatForm"><input id="message" maxlength="120" placeholder="メッセージ（120文字以内）" required><button>送信</button></form></div><div id="stats" class="tab hidden"></div><div id="leaderTools" class="hidden"><h3>LEADER CONTROL</h3><p class="muted" id="lockNotice"></p><form id="inviteForm"><label>メンバーを招待</label><input id="inviteCode" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" placeholder="招待するPLAYER ID" required><button class="roster">招待を送る</button></form><button id="disband" class="danger roster">パーティーを解散</button></div></section>
<section id="unaffiliated" class="panel hidden"><h2>パーティー結成申請</h2><p class="muted">申請者本人を含む3人のPLAYER IDを入力してください。運営の承認後に結成されます。</p><form id="applyForm"><label>パーティー名</label><input name="name" maxlength="30" minlength="2" required placeholder="パーティー名"><label>リーダー（あなた）の4桁ID</label><input name="code1" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required><label>メンバー2のID</label><input name="code2" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required><label>メンバー3のID</label><input name="code3" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required><button class="roster">運営に申請</button></form><h3>申請状況</h3><div id="applications"></div><h3>届いた招待</h3><div id="invites"></div></section>
<section class="panel"><p class="eyebrow">LIVE STANDINGS</p><h2>パーティーランキング</h2><div id="ranking"></div></section><section class="panel hidden" id="detail"><h2 id="detailName"></h2><div id="detailBody"></div><button onclick="document.getElementById('detail').classList.add('hidden')">閉じる</button></section>
</main><script>
const $=id=>document.getElementById(id);let state=null,rank=[];const token=localStorage.getItem('nexusParticipantToken')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('/api/party'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json','X-Participant-Token':token,Authorization:'Bearer '+token},...options});const data=await r.json();if(!r.ok)throw Error(data.error||'通信エラー');return data}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
function notice(s,error=false){$('notice').textContent=s;$('notice').classList.toggle('error',error)}
async function action(path,body,confirmText){if(confirmText&&!confirm(confirmText))return;try{await post(path,body);notice('操作が完了しました');await refresh()}catch(e){notice(e.message,true)}}
function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('hidden',x.id!==t));if(t==='chat')loadChat()}
async function refresh(){try{[state,rank]=await Promise.all([api('/mine'),api('/ranking')]);render()}catch(e){notice(e.message,true)}}
function render(){const p=state.party;$('mine').classList.toggle('hidden',!p);$('unaffiliated').classList.toggle('hidden',!!p);const disabled=state.locked?'disabled':'';
$('ranking').innerHTML=rank.length?rank.map((r,i)=>`<div class="row"><a href="#detail" onclick="detail(${Number(r.id)});return false">${i+1}位　${esc(r.name)}</a><b>${Number(r.points)} pt</b></div>`).join(''):'<p class="muted">まだパーティーがありません。</p>';
if(!p){$('applications').innerHTML=state.applications.map(a=>`<div class="row">${esc(a.name)} <span class="pill">${({pending:'審査待ち',approved:'承認',rejected:'却下'})[a.status]||esc(a.status)}</span></div>`).join('')||'<p class="muted">申請なし</p>';$('invites').innerHTML=state.invites.map(i=>`<div class="row"><span>${esc(i.name)}</span><div class="actions"><button ${disabled} onclick="action('/invites/${Number(i.id)}/accept',{})">承認</button><button ${disabled} onclick="action('/invites/${Number(i.id)}/reject',{})">拒否</button></div></div>`).join('')||'<p class="muted">招待なし</p>';}
else{$('pname').textContent=p.name;$('ppoints').textContent=p.points+' pt';const idx=rank.findIndex(x=>String(x.id)===String(p.id));$('prank').textContent=idx<0?'—':(idx+1)+'位';const wins=Number(p.wins),losses=Number(p.losses),draws=Number(p.draws);$('prate').textContent=(wins+losses+draws)?Math.round(wins/(wins+losses+draws)*100)+'%':'—';$('stats').innerHTML=`<p>勝利 ${wins} / 引分 ${draws} / 敗北 ${losses}</p><p class="muted">異なるパーティー同士の対象対戦のみ集計</p>`;$('members').innerHTML=state.members.map(m=>`<div class="row"><span>${String(m.id)===String(p.leader_id)?'👑 ':''}${esc(m.username)} <small class="muted">#${esc(m.public_code)}</small></span><div class="actions">${String(m.id)!==String(p.leader_id)?`<button onclick="action('/transfer',{userId:${Number(m.id)}},'リーダー権限を譲渡しますか？')">譲渡</button><button class="roster" ${disabled} onclick="action('/remove',{userId:${Number(m.id)}},'このメンバーを脱退させますか？')">脱退</button>`:''}</div></div>`).join('');const isLeader=String(p.leader_id)===String(window.myUserId);$('leaderTools').classList.toggle('hidden',!isLeader);if(!isLeader){$('members').querySelectorAll('button').forEach(b=>b.remove())}$('lockNotice').textContent=state.locked?'大会期間中のため、加入・脱退・解散は停止中です。':'';document.querySelectorAll('.roster').forEach(x=>x.disabled=state.locked);}
}
async function detail(id){try{const d=await api('/detail/'+id);$('detail').classList.remove('hidden');$('detailName').textContent=d.party.name;$('detailBody').innerHTML=`<p>${Number(d.party.points)} pt / ${Number(d.party.wins)}勝 ${Number(d.party.draws)}分 ${Number(d.party.losses)}敗</p><h3>メンバー</h3>${d.members.map(m=>`<p>${esc(m.username)} #${esc(m.public_code)}</p>`).join('')}<h3>貢献記録（過去メンバーを含む）</h3>${d.contributions.map(x=>`<p>${esc(x.name)}：${x.points}pt / ${x.wins}勝 ${x.draws}分 ${x.losses}敗</p>`).join('')}`;$('detail').scrollIntoView({behavior:'smooth'})}catch(e){notice(e.message,true)}}
async function loadChat(){try{const m=await api('/chat');$('messages').innerHTML=m.map(x=>`<div class="bubble"><small>${esc(x.sender_name)} · ${new Date(x.created_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</small>${esc(x.message)}</div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}catch(e){notice(e.message,true)}}
$('applyForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await action('/apply',{name:f.get('name'),codes:[f.get('code1'),f.get('code2'),f.get('code3')]})};
$('inviteForm').onsubmit=async e=>{e.preventDefault();await action('/invite',{code:$('inviteCode').value})};
$('chatForm').onsubmit=async e=>{e.preventDefault();try{await post('/chat',{message:$('message').value});$('message').value='';await loadChat()}catch(e){notice(e.message,true)}};
$('disband').onclick=()=>action('/disband',{},'パーティーを解散します。ポイント・戦績・チャット・大会履歴は消え、復元できません。実行しますか？');
(async()=>{try{const r=await fetch('/api/me',{credentials:'same-origin',headers:{'X-Participant-Token':token,Authorization:'Bearer '+token}});if(r.ok){const d=await r.json();window.myUserId=Number(d.id??d.user?.id);const input=document.querySelector('[name=code1]');input.value=d.public_code??d.user?.public_code??'';}}catch{}await refresh()})();
</script></body></html>
