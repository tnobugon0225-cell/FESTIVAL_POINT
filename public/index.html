<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FESTIVAL POINTS</title><link rel="stylesheet" href="/style.css"></head><body>
<nav><strong>FESTIVAL POINTS</strong><div class="nav-links"><a href="#ranking">ランキング</a><a href="/admin">スタッフ</a></div></nav>
<main>
<section id="auth" class="card"><div class="hero"><span class="badge">学祭イベント</span><h1 style="margin-top:12px">ポイントバトル</h1><p class="muted">アカウントを作成して、自分のポイントを確認しよう。</p></div><label>ニックネーム</label><input id="username" maxlength="20" autocomplete="username" placeholder="例：ノノンガ"><label>パスワード</label><input id="password" type="password" maxlength="72" autocomplete="current-password" placeholder="6文字以上"><div class="row"><button id="loginBtn">ログイン</button><button id="registerBtn" class="secondary">新規登録</button></div><p id="authMsg" class="error"></p></section>

<section id="account" class="hidden">
<div class="card hero"><div class="name">ログイン中</div><h1 id="name"></h1><div id="points" class="points">0 pt</div><p id="rankText" class="muted"></p><div class="row"><button id="refreshBtn" class="secondary">今すぐ更新</button><button id="logoutBtn" class="secondary">ログアウト</button></div></div>
<div class="tabs"><button class="tab active" data-target="historyCard">履歴</button><button class="tab" data-target="qrCard">マイQR</button><button class="tab" data-target="rankingCard">ランキング</button></div>
<div id="historyCard" class="card tab-card"><h2>ポイント履歴</h2><div id="history"></div></div>
<div id="qrCard" class="card tab-card hidden"><h2>マイQR</h2><p class="muted">スタッフにこのQRを見せると、あなたのアカウントをすぐ呼び出せます。</p><div class="qr-wrap"><img id="qrImg" alt="参加者QR"><p class="muted small">参加者コード</p><strong id="publicCode" class="code"></strong></div></div>
<div id="rankingCard" class="card tab-card hidden"><h2>ランキング</h2><div id="ranking"></div></div>
</section>
<section id="publicRanking" class="card"><div class="section-title"><h2 id="ranking">現在のランキング</h2><button id="publicRefresh" class="secondary" style="width:auto;margin:0">更新</button></div><div id="publicRankingList"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);let timer=null;
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'通信に失敗しました');return d}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function fmt(s){return s?new Date(s.replace(' ','T')+'Z').toLocaleString('ja-JP'):''}
async function getRanking(){const rows=await api('/api/ranking');const html=rows.length?rows.map((u,i)=>`<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-name">${esc(u.username)}</span><strong>${u.points.toLocaleString()} pt</strong></div>`).join(''):'<p class="muted">まだ参加者はいません。</p>';$('#ranking').innerHTML=html;$('#publicRankingList').innerHTML=html;return rows}
async function loadMe(){try{const me=await api('/api/me');$('#auth').classList.add('hidden');$('#account').classList.remove('hidden');$('#publicRanking').classList.add('hidden');$('#name').textContent=me.username;$('#points').textContent=me.points.toLocaleString()+' pt';const [hist,qr,rank]=await Promise.all([api('/api/my-history'),api('/api/my-qr'),getRanking()]);$('#history').innerHTML=hist.length?hist.map(h=>{let label=h.action_type==='transfer_out'?` → ${esc(h.counterpart||'相手')}`:h.action_type==='transfer_in'?` ← ${esc(h.counterpart||'相手')}`:'';return `<div class="history-item"><div><strong>${h.delta>0?'+':''}${h.delta.toLocaleString()} pt</strong>${label}${h.reason?` <span class="muted">(${esc(h.reason)})</span>`:''}</div><div class="muted small">${fmt(h.created_at)}</div></div>`}).join(''):'<p class="muted">まだ履歴はありません。</p>';$('#qrImg').src=qr.dataUrl;$('#publicCode').textContent=qr.code;const idx=rank.findIndex(x=>x.username===me.username);$('#rankText').textContent=idx>=0?`現在 ${idx+1}位 / ${rank.length}人`:'';clearInterval(timer);timer=setInterval(loadMe,5000)}catch(e){clearInterval(timer);$('#account').classList.add('hidden');$('#auth').classList.remove('hidden');$('#publicRanking').classList.remove('hidden');getRanking().catch(()=>{})}}
async function auth(mode){$('#authMsg').textContent='';try{await api('/api/'+mode,{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});$('#password').value='';loadMe()}catch(e){$('#authMsg').textContent=e.message}}
$('#loginBtn').onclick=()=>auth('login');$('#registerBtn').onclick=()=>auth('register');$('#refreshBtn').onclick=loadMe;$('#logoutBtn').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};$('#publicRefresh').onclick=()=>getRanking();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-card').forEach(x=>x.classList.add('hidden'));b.classList.add('active');$('#'+b.dataset.target).classList.remove('hidden')});loadMe();
</script></body></html>
