<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>JANKEN BO5 | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script><script src="/ui-fx.js" defer></script></head>
<body class="player-page janken-page"><div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><span>JANKEN BO5</span></div></nav>
<main class="jk-shell"><section class="system-panel jk-screen"><div class="jk-head"><div><div class="eyebrow">QUICK BATTLE // SYSTEM JUDGEMENT</div><h1>JANKEN</h1><p>BO5 // FIRST TO 3</p></div><div id="jkStatus" class="hb-status">CONNECTING</div></div><div id="jkPlayers" class="battle-player-row quick-versus-row"></div><div id="jkPoints" class="jk-points"></div><div id="jkBody"></div><p id="jkMsg" class="match-action-msg"></p></section></main>
<script>
const $=s=>document.querySelector(s),authToken=localStorage.getItem('nexusParticipantToken')||'';
let matchId=null,poll=null,lastView='',lastRoundCount=null,revealBusy=false,returnTimer=null,playerHeaderKey='';
let roundClockKey='',roundDeadlinePerf=0,roundTimer=null,currentChoice=null,choiceSending=false;
async function api(url,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(authToken){headers['X-Participant-Token']=authToken;headers.Authorization='Bearer '+authToken}const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'通信に失敗しました');e.status=r.status;throw e}return d}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function avatarSrc(k){return `/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(String(k||''))?k:'avatar-01'}.webp`}
function resultMark(extra){return extra==='winner'?'<div class="jk-result-mark jk-victor">VICTOR</div>':extra==='loser'?'<div class="jk-result-mark jk-defeated">DEFEATED</div><i class="jk-defeat-slash"></i>':''}
function person(p,label,extra=''){return `<div class="battle-person ${extra?`result-${extra}`:''}"><div class="battle-avatar-wrap"><img class="battle-person-avatar" src="${avatarSrc(p.avatarKey)}" alt="">${resultMark(extra)}</div><span>${label}</span><strong>${esc(p.name)}</strong></div>`}
const hands={rock:{jp:'グー',code:'ROCK',img:'/janken/rock.webp'},scissors:{jp:'チョキ',code:'SCISSORS',img:'/janken/scissors.webp'},paper:{jp:'パー',code:'PAPER',img:'/janken/paper.webp'}};
Object.values(hands).forEach(h=>{const i=new Image();i.src=h.img});
function scoreDots(n){return [0,1,2].map(i=>`<i class="${i<n?'on':''}"></i>`).join('')}
function scoreBoard(m){return `<div class="jk-score"><div><span>${esc(m.challenger.name)}</span><b>${m.challengerJankenWins}</b><em>${scoreDots(m.challengerJankenWins)}</em></div><strong>ROUND ${String(m.jankenRound).padStart(2,'0')}</strong><div><span>${esc(m.opponent.name)}</span><b>${m.opponentJankenWins}</b><em>${scoreDots(m.opponentJankenWins)}</em></div></div>`}
function choiceButtons(){return `<div class="jk-choice-grid">${Object.entries(hands).map(([k,v])=>`<button type="button" class="jk-choice" data-hand="${k}" onclick="choose('${k}')"><img src="${v.img}" alt="${v.jp}" draggable="false"><div><b>${v.code}</b><small>${v.jp}</small></div></button>`).join('')}</div>`}
function syncChoiceUI(m){currentChoice=m.myJankenChoice||currentChoice||null;document.querySelectorAll('.jk-choice').forEach(b=>{const selected=b.dataset.hand===currentChoice;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',selected?'true':'false')});const my=$('#mySignal');if(my)my.textContent=currentChoice?`${hands[currentChoice].code} / ${hands[currentChoice].jp}`:'NOT SELECTED';const rival=$('#rivalSignal');if(rival)rival.textContent=m.rivalJankenLocked?'READY':'SELECTING'}
function showVsIntro(m){const key=`janken:${m.id}:${m.startedAt}`;if(sessionStorage.getItem(`nexusIntro:${key}`)==='1')return;sessionStorage.setItem(`nexusIntro:${key}`,'1');const o=document.createElement('div');o.className='prebattle-intro';o.innerHTML=`<div class="prebattle-player prebattle-a"><img src="${avatarSrc(m.challenger.avatarKey)}"><strong>${esc(m.challenger.name)}</strong></div><div class="prebattle-vs">VS</div><div class="prebattle-player prebattle-b"><img src="${avatarSrc(m.opponent.avatarKey)}"><strong>${esc(m.opponent.name)}</strong></div>`;document.body.appendChild(o);setTimeout(()=>o.classList.add('show'),30);setTimeout(()=>{o.classList.remove('show');setTimeout(()=>o.remove(),350)},3000)}
function reveal(round,m){if(revealBusy||!round)return;revealBusy=true;const c=hands[round.challengerChoice],o=hands[round.opponentChoice];const mineId=m.role==='challenger'?m.challenger.id:m.opponent.id;const mineWon=round.winnerUserId&&Number(round.winnerUserId)===Number(mineId);const draw=round.result==='draw';const ov=document.createElement('div');ov.className='jk-reveal-overlay jk-locking';ov.innerHTML=`<div class="jk-reveal-core"><div class="eyebrow">ROUND ${String(round.roundNo).padStart(2,'0')}</div><div class="jk-lock-title">SIGNALS LOCKED</div><div class="jk-lock-line"><i></i></div><p>選択信号を確定しています</p></div>`;document.body.appendChild(ov);requestAnimationFrame(()=>ov.classList.add('show'));
setTimeout(()=>{ov.classList.remove('jk-locking');const resultClass=draw?'draw':mineWon?'win':'lose';ov.innerHTML=`<div class="jk-reveal-core jk-round-result ${resultClass}"><div class="eyebrow">ROUND ${String(round.roundNo).padStart(2,'0')} // RESULT</div><div class="jk-reveal-hands image-mode"><div><img src="${c.img}" alt="${c.jp}"><b>${c.code}</b><small>${esc(m.challenger.name)}</small></div><strong>VS</strong><div><img src="${o.img}" alt="${o.jp}"><b>${o.code}</b><small>${esc(m.opponent.name)}</small></div></div><div class="jk-result-banner">${draw?'DRAW':mineWon?'ROUND WIN':'ROUND LOSE'}</div><p>${draw?'あいこ / スコアは変わりません':mineWon?'このラウンドを獲得':'相手がこのラウンドを獲得'}</p></div>`;setTimeout(()=>{ov.classList.remove('show');setTimeout(()=>{ov.remove();revealBusy=false;lastView='';load()},280)},4200)},1500)}
function syncRoundClock(m){const key=`${m.id}:${m.jankenRound}:${m.jankenRoundStartedAt||''}`;if(roundClockKey!==key){roundClockKey=key;const end=m.jankenRoundDeadlineAt?new Date(m.jankenRoundDeadlineAt).getTime():Date.now()+15000;roundDeadlinePerf=performance.now()+Math.max(0,Math.min(15000,end-Date.now()));if(!roundTimer)roundTimer=setInterval(updateRoundClock,100)}updateRoundClock()}
function updateRoundClock(){const el=$('#jkTimer');if(!el||!roundDeadlinePerf)return;const ms=Math.max(0,roundDeadlinePerf-performance.now());const sec=Math.ceil(ms/1000);el.textContent=sec;el.closest('.jk-round-timer')?.classList.toggle('danger',sec<=5);if(sec<=0){document.querySelectorAll('.jk-choice').forEach(b=>b.disabled=true)}}
async function choose(choice){if(choiceSending||revealBusy)return;currentChoice=choice;syncChoiceUI({myJankenChoice:choice,rivalJankenLocked:$('#rivalSignal')?.textContent==='READY'});choiceSending=true;try{await api(`/api/quick-matches/${matchId}/janken-choice`,{method:'POST',body:JSON.stringify({choice})});$('#jkMsg').className='match-action-msg';$('#jkMsg').textContent='';}catch(e){$('#jkMsg').className='match-action-msg error';$('#jkMsg').textContent=e.message;lastView='';await load()}finally{choiceSending=false}}
function resultReturn(m){if(returnTimer)return;const end=new Date(m.completedAt).getTime()+10000;returnTimer=setInterval(()=>{const n=Math.max(0,Math.ceil((end-Date.now())/1000));const el=$('#jkReturn');if(el)el.textContent=n;if(n<=0){clearInterval(returnTimer);location.href='/'}},250)}
async function approveMatch(){try{await api(`/api/quick-matches/${matchId}/approve`,{method:'POST'});lastView='';await load()}catch(e){$('#jkMsg').textContent=e.message}}
async function cancelMatch(){if(!confirm('この対戦申請を取り消しますか？'))return;try{await api(`/api/quick-matches/${matchId}/reject`,{method:'POST'});location.href='/'}catch(e){$('#jkMsg').textContent=e.message}}
async function load(){if(revealBusy)return;try{const r=await api('/api/quick-matches/me');const m=r.match;if(!m){window.NexusBGM?.setTrack('home');$('#jkBody').innerHTML='<div class="battle-wait-large">NO ACTIVE JANKEN<span>HOMEへ戻って対戦を申し込んでください</span></div>';return}if(m.gameType!=='janken'){location.href='/hit-blow';return}matchId=m.id;const st=await api(`/api/quick-matches/${m.id}/janken-state`);Object.assign(m,st.match);const rounds=st.rounds||[];
const hk=`${m.id}:${m.challenger.avatarKey}:${m.challenger.name}:${m.opponent.avatarKey}:${m.opponent.name}`;if(playerHeaderKey!==hk){$('#jkPlayers').innerHTML=`${person(m.challenger,'PLAYER A')}<div class="battle-vs">VS</div>${person(m.opponent,'RIVAL')}`;$('#jkPoints').innerHTML=`<span>BATTLE POINTS</span><strong>${Number(m.wager).toLocaleString()} pt</strong>`;playerHeaderKey=hk}
if(lastRoundCount===null)lastRoundCount=rounds.length;else if(rounds.length>lastRoundCount){const latest=rounds[rounds.length-1];lastRoundCount=rounds.length;reveal(latest,m);return}
if(m.status==='pending'){window.NexusBGM?.setTrack('matching');$('#jkStatus').textContent='MATCHING';const k=`pending:${m.role}`;if(lastView!==k){$('#jkBody').innerHTML=m.role==='challenger'?'<div class="battle-wait-large">RIVAL APPROVAL WAITING<span>対戦相手の承認を待っています</span><button class="ghost" onclick="cancelMatch()">申請を取り消す</button></div>':'<div class="battle-wait-large">BATTLE REQUEST<span>JANKEN BO5 の申請を受信しました</span><div class="match-actions"><button class="success" onclick="approveMatch()">承認する</button><button class="danger" onclick="cancelMatch()">拒否する</button></div></div>';lastView=k}return}
if(m.status==='in_progress'){window.NexusBGM?.setTrack('battle');$('#jkStatus').textContent='BATTLE LIVE';showVsIntro(m);const k=`live:${m.id}:${m.jankenRound}:${m.challengerJankenWins}:${m.opponentJankenWins}`;if(lastView!==k){currentChoice=m.myJankenChoice||null;$('#jkBody').innerHTML=`${scoreBoard(m)}<div class="jk-command stable"><div class="jk-command-head"><div><div class="eyebrow">SELECT YOUR SIGNAL</div><h2>15秒以内なら何度でも変更可能</h2></div><div class="jk-round-timer"><span>TIME LEFT</span><b id="jkTimer">15</b><i>SEC</i></div></div>${choiceButtons()}<div class="jk-wait-state"><span>YOUR SIGNAL : <b id="mySignal">NOT SELECTED</b></span><span>RIVAL SIGNAL : <b id="rivalSignal">SELECTING</b></span></div><p>時間終了時に選択中の手で判定します。未選択の場合はシステムがランダム選択します。</p></div>`;lastView=k}syncChoiceUI(m);syncRoundClock(m);return}
if(m.status==='completed'){window.NexusBGM?.setTrack('victory');clearInterval(poll);const mine=m.role==='challenger'?m.challenger:m.opponent,won=Number(m.winnerUserId)===Number(mine.id),cWin=Number(m.winnerUserId)===Number(m.challenger.id);const rhk=`result:${m.id}:${m.winnerUserId}`;if(playerHeaderKey!==rhk){$('#jkPlayers').innerHTML=`${person(m.challenger,'PLAYER A',cWin?'winner':'loser')}<div class="battle-vs">VS</div>${person(m.opponent,'RIVAL',cWin?'loser':'winner')}`;playerHeaderKey=rhk}$('#jkStatus').textContent='COMPLETE';$('#jkBody').innerHTML=`${scoreBoard(m)}<div class="hb-result ${won?'win':'lose'}"><div class="eyebrow">JANKEN BO5 COMPLETE</div><h2>${won?'VICTORY':'DEFEAT'}</h2><strong>${won?'+':'-'}${Number(m.wager).toLocaleString()} pt</strong><p>WINNER : ${esc(m.winnerName)}</p><div>HOMEへ戻るまで <b id="jkReturn">10</b> 秒</div></div>`;resultReturn(m)}}catch(e){if(e.status===401||e.status===403){location.href='/';return}$('#jkMsg').textContent=e.message}}
load();poll=setInterval(load,500);
</script></body></html>
