<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>CHINCHIRO | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script><script src="/ui-fx.js" defer></script></head>
<body class="player-page chinchiro-page"><div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><span>CHINCHIRO</span></div></nav>
<main class="cc-shell"><section class="system-panel cc-screen"><div class="cc-head"><div><div class="eyebrow">QUICK BATTLE // SYSTEM JUDGEMENT</div><h1>CHINCHIRO</h1><p>3 DICE // MAX 3 ROLLS</p></div><div id="ccStatus" class="hb-status">CONNECTING</div></div><div id="ccPlayers" class="battle-player-row quick-versus-row"></div><div id="ccPoints" class="jk-points"></div><div id="ccBody"></div><p id="ccMsg" class="match-action-msg"></p></section></main>
<script>
const $=s=>document.querySelector(s),authToken=localStorage.getItem('nexusParticipantToken')||'';
let matchId=null,poll=null,lastView='',rolling=false,externalCutin=false,returnTimer=null,playerHeaderKey='',rollFeedReady=false,lastSeenRollKey='';
async function api(url,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(authToken){headers['X-Participant-Token']=authToken;headers.Authorization='Bearer '+authToken}const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'通信に失敗しました');e.status=r.status;throw e}return d}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function avatarSrc(k){return `/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(String(k||''))?k:'avatar-01'}.webp`}
function resultMark(extra){return extra==='winner'?'<div class="jk-result-mark jk-victor">VICTOR</div>':extra==='loser'?'<div class="jk-result-mark jk-defeated">DEFEATED</div><i class="jk-defeat-slash"></i>':''}
function person(p,label,extra=''){return `<div class="battle-person ${extra?`result-${extra}`:''}"><div class="battle-avatar-wrap"><img class="battle-person-avatar" src="${avatarSrc(p.avatarKey)}" alt="">${resultMark(extra)}</div><span>${label}</span><strong>${esc(p.name)}</strong></div>`}
function diceArray(t){return String(t||'').split('-').filter(Boolean).map(Number)}
function pipHtml(n){const map={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};return Array.from({length:9},(_,i)=>`<i class="${(map[n]||[]).includes(i+1)?'on':''}"></i>`).join('')}
function diceHtml(vals,rollingMode=false){const a=vals.length?vals:[1,1,1];return `<div class="cc-dice-row ${rollingMode?'rolling':''}">${a.map((n,i)=>`<div class="cc-die d${i+1}" data-face="${n}"><div class="cc-die-grid">${pipHtml(n)}</div><b>NODE ${String(i+1).padStart(2,'0')}</b></div>`).join('')}</div>`}
function setDieFace(d,n){d.dataset.face=n;const g=d.querySelector('.cc-die-grid');if(g)g.innerHTML=pipHtml(n)}
function roleText(role,value,dice){if(role==='shigoro')return 'SHIGORO / 4-5-6';if(role==='hifumi')return 'HIFUMI / 1-2-3';if(role==='arashi')return `ARASHI / ${esc(dice||'')}`;if(role==='point')return `POINT ${Math.max(1,Number(value||21)-20)}`;return 'NO ROLE'}
function roleClass(role){return role==='shigoro'?'best':role==='arashi'?'strong':role==='point'?'point':role==='hifumi'?'bad':'none'}
function finalHand(name,role,value,dice){if(!role)return `<div class="cc-hand pending"><span>${esc(name)}</span><strong>WAITING</strong><small>HAND NOT FIXED</small></div>`;return `<div class="cc-hand ${roleClass(role)}"><span>${esc(name)}</span><strong>${roleText(role,value,dice)}</strong><div class="cc-mini-dice">${diceArray(dice).map(n=>`<i>${n}</i>`).join('')}</div></div>`}
function showVsIntro(m){const key=`chinchiro:${m.id}:${m.startedAt}`;if(sessionStorage.getItem(`nexusIntro:${key}`)==='1')return;sessionStorage.setItem(`nexusIntro:${key}`,'1');const o=document.createElement('div');o.className='prebattle-intro';o.innerHTML=`<div class="prebattle-player prebattle-a"><img src="${avatarSrc(m.challenger.avatarKey)}"><strong>${esc(m.challenger.name)}</strong></div><div class="prebattle-vs">VS</div><div class="prebattle-player prebattle-b"><img src="${avatarSrc(m.opponent.avatarKey)}"><strong>${esc(m.opponent.name)}</strong></div>`;document.body.appendChild(o);setTimeout(()=>o.classList.add('show'),30);const scheduled=m.turnStartedAt?new Date(m.turnStartedAt).getTime():Date.now()+3000;const duration=Math.max(500,scheduled-Date.now());setTimeout(()=>{o.classList.remove('show');setTimeout(()=>o.remove(),350)},duration)}
function showRollCutin(r,playerName,draw=false){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.className='cc-roll-overlay';
    ov.innerHTML=`<div class="cc-roll-core"><div class="cc-roll-scanline"></div><div class="eyebrow">DICE LINK // ${esc(playerName)}</div><div class="cc-roll-title">RANDOM NODE CAST</div>${diceHtml([1,2,3],true)}<div class="cc-roll-status"><span>ROLLING SIGNAL...</span></div></div>`;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('show'));
    const dice=[...ov.querySelectorAll('.cc-die')];
    let ticks=0;
    const timer=setInterval(()=>{
      dice.forEach(d=>setDieFace(d,1+Math.floor(Math.random()*6)));
      ticks++;
      if(ticks<24)return;
      clearInterval(timer);
      const vals=r.dice||[1,1,1];
      const row=ov.querySelector('.cc-dice-row');
      row.classList.add('locking');
      dice.forEach((d,i)=>{
        setTimeout(()=>{
          setDieFace(d,vals[i]);
          d.classList.add('locked');
          if(i!==2)return;
          setTimeout(()=>{
            row.classList.remove('rolling','locking');
            const status=ov.querySelector('.cc-roll-status');
            status.className=`cc-roll-status reveal ${roleClass(r.role)}`;
            status.innerHTML=`<small>ROLE DETECTED</small><strong>${esc(r.label)}</strong><span>${r.final?'HAND LOCKED':`NO ROLE // RE-ROLL ${3-r.attempt} LEFT`}</span>${draw?'<em>DRAW // NEW ROUND</em>':''}`;
            setTimeout(()=>{
              ov.classList.remove('show');
              setTimeout(()=>{ov.remove();resolve()},280);
            },draw?3100:2500);
          },600);
        },i*430);
      });
    },85);
  });
}
function resultReturn(m){if(returnTimer)return;const key=`nexusFinalResult:chinchiro:${m.id}`;let end=Number(sessionStorage.getItem(key)||0);if(!end){end=Date.now()+10000;sessionStorage.setItem(key,String(end))}const tick=()=>{const n=Math.max(0,Math.ceil((end-Date.now())/1000));const el=$('#ccReturn');if(el)el.textContent=n;if(n<=0){clearInterval(returnTimer);returnTimer=null;location.href='/'}};tick();returnTimer=setInterval(tick,250)}
async function rollDice(){if(rolling||externalCutin)return;rolling=true;const btn=$('#ccRollBtn');if(btn)btn.disabled=true;$('#ccMsg').textContent='';try{const r=await api(`/api/quick-matches/${matchId}/chinchiro-roll`,{method:'POST'});const m=r.match;const me=m.role==='challenger'?m.challenger:m.opponent;await showRollCutin(r.roll,me.name,!!r.draw);lastView='';await load()}catch(e){$('#ccMsg').className='match-action-msg error';$('#ccMsg').textContent=e.message;lastView='';await load()}finally{rolling=false}}
async function approveMatch(){try{await api(`/api/quick-matches/${matchId}/approve`,{method:'POST'});lastView='';await load()}catch(e){$('#ccMsg').textContent=e.message}}
async function cancelMatch(){if(!confirm('この対戦申請を取り消しますか？'))return;try{await api(`/api/quick-matches/${matchId}/reject`,{method:'POST'});location.href='/'}catch(e){$('#ccMsg').textContent=e.message}}
function latestRollFor(rolls,id,round){return [...rolls].reverse().find(x=>Number(x.playerId)===Number(id)&&Number(x.roundNo)===Number(round))||null}
function firstLockedHand(m){const c=!!m.challengerChinchiroRole,o=!!m.opponentChinchiroRole;if(c&&!o)return {name:m.challenger.name,role:m.challengerChinchiroRole,value:m.challengerChinchiroValue,dice:m.challengerChinchiroDice};if(o&&!c)return {name:m.opponent.name,role:m.opponentChinchiroRole,value:m.opponentChinchiroValue,dice:m.opponentChinchiroDice};return null}
function targetHandHtml(m){const h=firstLockedHand(m);if(!h)return '';return `<div class="cc-target-hand ${roleClass(h.role)}"><div><span>FIRST HAND // TARGET</span><strong>${esc(h.name)}</strong></div><div class="cc-target-role">${roleText(h.role,h.value,h.dice)}</div><div class="cc-mini-dice">${diceArray(h.dice).map(n=>`<i>${n}</i>`).join('')}</div></div>`}
function roleRankHtml(){return `<div class="cc-rank-panel"><div class="cc-rank-title"><span>ROLE STRENGTH</span><small>HIGH → LOW</small></div><div class="cc-rank-list"><b class="s"><i>S</i>SHIGORO <em>4-5-6</em></b><b class="a"><i>A</i>ARASHI <em>6 → 1</em></b><b class="b"><i>B</i>POINT <em>6 → 1</em></b><b class="c"><i>C</i>NO ROLE</b><b class="d"><i>D</i>HIFUMI <em>1-2-3</em></b></div></div>`}
async function load(){if(rolling||externalCutin)return;try{const r=await api('/api/quick-matches/me');const m=r.match;if(!m){window.NexusBGM?.setTrack('home');$('#ccBody').innerHTML='<div class="battle-wait-large">NO ACTIVE CHINCHIRO<span>HOMEへ戻って対戦を申し込んでください</span></div>';return}if(m.gameType!=='chinchiro'){location.href=m.gameType==='janken'?'/janken':'/hit-blow';return}matchId=m.id;const st=await api(`/api/quick-matches/${m.id}/chinchiro-state`);Object.assign(m,st.match);const rolls=st.rolls||[];
const mineNow=m.role==='challenger'?m.challenger:m.opponent;
const latest=rolls.length?rolls[rolls.length-1]:null;
const latestKey=latest?`${latest.roundNo}:${latest.playerId}:${latest.attemptNo}:${latest.dice}:${latest.createdAt||''}`:'';
if(!rollFeedReady){lastSeenRollKey=latestKey;rollFeedReady=true}else if(latest&&latestKey!==lastSeenRollKey){
  const rivalRoll=Number(latest.playerId)!==Number(mineNow.id);
  lastSeenRollKey=latestKey;
  if(rivalRoll){
    externalCutin=true;
    const inferredFinal=latest.role!=='none'||Number(latest.attemptNo)>=3;
    const draw=Number(latest.roundNo)<Number(m.chinchiroRound);
    await showRollCutin({dice:diceArray(latest.dice),attempt:Number(latest.attemptNo),final:inferredFinal,role:latest.role,value:latest.roleValue,label:roleText(latest.role,latest.roleValue,latest.dice)},latest.playerName,draw);
    externalCutin=false;lastView='';
  }
}
const hk=`${m.id}:${m.challenger.avatarKey}:${m.challenger.name}:${m.opponent.avatarKey}:${m.opponent.name}`;if(playerHeaderKey!==hk){$('#ccPlayers').innerHTML=`${person(m.challenger,'PLAYER A')}<div class="battle-vs">VS</div>${person(m.opponent,'RIVAL')}`;$('#ccPoints').innerHTML=`<span>BATTLE POINTS</span><strong>${Number(m.wager).toLocaleString()} pt</strong>`;playerHeaderKey=hk}
if(m.status==='pending'){window.NexusBGM?.setTrack('matching');$('#ccStatus').textContent='MATCHING';const k=`pending:${m.role}`;if(lastView!==k){$('#ccBody').innerHTML=m.role==='challenger'?'<div class="battle-wait-large">RIVAL APPROVAL WAITING<span>対戦相手の承認を待っています</span><button class="ghost" onclick="cancelMatch()">申請を取り消す</button></div>':'<div class="battle-wait-large">BATTLE REQUEST<span>CHINCHIRO の申請を受信しました</span><div class="match-actions"><button class="success" onclick="approveMatch()">承認する</button><button class="danger" onclick="cancelMatch()">拒否する</button></div></div>';lastView=k}return}
if(m.status==='in_progress'){window.NexusBGM?.setTrack('battle');$('#ccStatus').textContent='BATTLE LIVE';showVsIntro(m);const mine=m.role==='challenger'?m.challenger:m.opponent;const myTurn=Number(m.turnPlayerId)===Number(mine.id);const start=m.turnStartedAt?new Date(m.turnStartedAt).getTime():0;const waitingStart=Date.now()<start;const currentLatest=latestRollFor(rolls,m.turnPlayerId,m.chinchiroRound);const left=Math.max(0,3-Number(m.chinchiroAttempt||0));const k=`live:${m.id}:${m.chinchiroRound}:${m.turnPlayerId}:${m.chinchiroAttempt}:${rolls.length}:${waitingStart}`;if(lastView!==k){$('#ccBody').innerHTML=`<div class="cc-round-head"><span>ROUND ${String(m.chinchiroRound).padStart(2,'0')}</span><strong>${myTurn?'YOUR TURN':'RIVAL TURN'}</strong><small>${waitingStart?'SYSTEM SYNC...':myTurn?'ROLL AVAILABLE':'RIVAL CASTING'}</small></div>${targetHandHtml(m)}<div class="cc-table"><div class="cc-table-kicker"><span>DICE CORE</span><i>${myTurn?'LOCAL CONTROL':'REMOTE LINK'}</i></div>${diceHtml(currentLatest?diceArray(currentLatest.dice):[1,1,1])}<div class="cc-role-now ${currentLatest?roleClass(currentLatest.role):'none'}">${currentLatest?roleText(currentLatest.role,currentLatest.roleValue,currentLatest.dice):'AWAITING ROLL'}</div>${myTurn?`<button id="ccRollBtn" class="primary-action cc-roll-btn" onclick="rollDice()" ${waitingStart?'disabled':''}>${Number(m.chinchiroAttempt||0)>0?'RE-ROLL DICE':'ROLL DICE'}<span>${left} / 3</span></button>`:'<div class="cc-rival-wait"><i></i>RIVAL DICE LINK ACTIVE</div>'}<p>役なしの場合のみ最大2回振り直し。役成立で手番をロック。</p></div>${roleRankHtml()}`;lastView=k;if(waitingStart)setTimeout(()=>{lastView='';load()},Math.max(50,start-Date.now()+40))}return}
if(m.status==='completed'){window.NexusBGM?.setTrack('victory');clearInterval(poll);const mine=m.role==='challenger'?m.challenger:m.opponent,won=Number(m.winnerUserId)===Number(mine.id),cWin=Number(m.winnerUserId)===Number(m.challenger.id);const rhk=`result:${m.id}:${m.winnerUserId}`;if(playerHeaderKey!==rhk){$('#ccPlayers').innerHTML=`${person(m.challenger,'PLAYER A',cWin?'winner':'loser')}<div class="battle-vs">VS</div>${person(m.opponent,'RIVAL',cWin?'loser':'winner')}`;playerHeaderKey=rhk}$('#ccStatus').textContent='COMPLETE';$('#ccBody').innerHTML=`<div class="cc-hand-grid result">${finalHand(m.challenger.name,m.challengerChinchiroRole,m.challengerChinchiroValue,m.challengerChinchiroDice)}<div class="cc-hand-vs">VS</div>${finalHand(m.opponent.name,m.opponentChinchiroRole,m.opponentChinchiroValue,m.opponentChinchiroDice)}</div><div class="hb-result ${won?'win':'lose'}"><div class="eyebrow">CHINCHIRO COMPLETE</div><h2>${won?'VICTORY':'DEFEAT'}</h2><strong>${won?'+':'-'}${Number(m.wager).toLocaleString()} pt</strong><p>WINNER : ${esc(m.winnerName)}</p><div>HOMEへ戻るまで <b id="ccReturn">10</b> 秒</div></div>`;resultReturn(m)}}catch(e){if(e.status===401||e.status===403){location.href='/';return}$('#ccMsg').textContent=e.message}}
load();poll=setInterval(load,650);
</script></body></html>
