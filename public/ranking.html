<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02050b">
  <title>RANKING | NEXUS:ZERO</title>
  <link rel="stylesheet" href="/style.css?v=party-layout-20261013-2">
<style>
/* Standalone switch layout: overrides all shared/global button rules */
body.ranking-page .ranking-hero .ranking-switch {display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:100%!important;max-width:440px!important;margin:22px auto 14px!important;}
body.ranking-page .ranking-hero .ranking-switch button.ranking-switch-button {display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;min-width:0!important;max-width:none!important;margin:0!important;padding:12px 5px!important;min-height:54px!important;flex:none!important;font-size:clamp(15px,4vw,19px)!important;box-sizing:border-box!important;}
body.ranking-page .ranking-hero .ranking-switch button.ranking-switch-button:not(.active){background:rgba(5,20,38,.88)!important;color:#9ebbd1!important;border-color:rgba(75,190,255,.35)!important;box-shadow:none!important;}
body.ranking-page .ranking-hero .ranking-switch button.ranking-switch-button.active{background:linear-gradient(100deg,#0877ff,#175cff 55%,#7543ff)!important;color:white!important;border-color:rgba(125,215,255,.65)!important;}
 .party-game-table{border:1px solid rgba(82,175,239,.3);border-radius:10px;overflow:hidden;margin:12px 0 20px}
.party-game-head,.party-game-row{display:grid;grid-template-columns:minmax(0,1.45fr) .65fr 1fr;gap:6px;align-items:center;padding:9px 9px}
.party-game-head{background:rgba(23,73,115,.3);font-size:11px;color:#9bc9e6}
.party-game-row{border-top:1px solid rgba(82,175,239,.16);font-size:13px}
.party-game-row strong{font-size:16px;white-space:nowrap}.party-game-row small{font-size:12px;color:#bedcf0;white-space:nowrap}
.party-game-row.is-total{background:rgba(23,73,115,.25);font-weight:800}
 .party-player-card{padding:10px 10px;margin:10px 0;border:1px solid rgba(82,175,239,.25);border-radius:10px;background:rgba(5,22,43,.4)}
.party-player-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.party-player-head strong{font-size:16px}.party-player-head span{color:#a4dfff;font-weight:700;font-size:12px}
.party-player-summary{margin:9px 0;font-size:12px}.party-player-summary strong{font-size:17px;margin:0 6px}.party-player-summary small{color:#9bc9e6}
.party-detail-member-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.party-detail-member-picker button{width:100%;min-width:0;margin:0;padding:9px 4px;font-size:12px;overflow-wrap:anywhere;border-radius:8px;background:rgba(9,35,61,.8)}
.party-detail-member-picker button.selected{background:linear-gradient(105deg,#076fe5,#4b4af0);border-color:#78dfff}
.party-ranking-detail .party-detail-metrics{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0 14px}
.party-ranking-detail .party-detail-metrics>div{padding:9px 3px;min-width:0}
.party-ranking-detail .party-detail-metrics strong{font-size:clamp(12px,3.1vw,17px);overflow-wrap:anywhere}
.party-ranking-detail .party-detail-heading h2{font-size:clamp(17px,4.4vw,24px);overflow-wrap:anywhere}
.party-ranking-detail .party-detail-heading button{flex-shrink:0}
.party-ranking-detail h3{font-size:16px;margin:15px 0 8px}
.party-ranking-detail .party-game-table{margin:8px 0 12px}
.party-ranking-detail .party-game-head,.party-ranking-detail .party-game-row{padding:9px 7px}
.party-ranking-detail .party-game-row{font-size:12px}
.party-ranking-detail .party-game-row strong{font-size:14px}
.party-ranking-detail .party-game-row small{font-size:11px}
</style>
  <script src="/bgm.js" defer></script>
  <script src="/ui-fx.js?v=party-fullname-authguard-20261014" defer></script>
</head>
<body class="player-page v52-player ranking-page">
<div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="cyber-orbit orbit-b"></div><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/" data-nexus-nav="HOME"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><a href="/" data-nexus-nav="HOME">HOME</a><a href="/rule" data-nexus-nav="RULE">RULE</a><a class="active" href="/ranking" data-nexus-nav="RANKING">RANKING</a><a href="/party" data-nexus-nav="PARTY">PARTY</a><a href="/history" data-nexus-nav="HISTORY">HISTORY</a><a href="/support.html" data-nexus-nav="CONTACT">CONTACT</a></div></nav>
<main class="app-shell arena-shell ranking-shell">
  <section class="ranking-hero system-panel">
    <div class="eyebrow">LIVE STANDINGS</div>
    <h1 id="rankingTitle">TOP 100 RANKING</h1>
    <p class="muted" id="rankingDescription">現在の上位100名を表示しています。</p>
    <div class="ranking-switch" role="group" aria-label="ランキング種別"><button type="button" id="individualTab" class="ranking-switch-button active" aria-pressed="true">個人</button><button type="button" id="partyTab" class="ranking-switch-button" aria-pressed="false">パーティー</button></div>
    <button id="refreshRanking" class="secondary compact">今すぐ更新</button>
  </section>
  <section class="system-panel top100-panel">
    <div id="fullRanking"><p class="muted">ランキングを読み込み中...</p></div>
  </section>
  <section class="system-panel party-ranking-detail" id="partyDetail" hidden><div class="party-detail-heading"><h2 id="partyDetailName">パーティー詳細</h2><div class="party-detail-heading-actions"><div class="party-detail-points"><small>POINTS</small><strong id="partyDetailPoints">—</strong></div><button type="button" id="closePartyDetail" class="secondary compact">閉じる</button></div></div><div id="partyDetailBody"></div></section>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>window.NexusBGM?.setTrack('home'));
const $=s=>document.querySelector(s);
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function avatarSrc(key){return `/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(String(key||''))?key:'avatar-01'}.webp`}
let rankingLoaded=false;let currentTab='individual';let partyRows=[];
function renderRanking(rows){
  const root=$('#fullRanking');
  const list=rows.slice(0,100);
  if(!list.length){
    if(!rankingLoaded||root.dataset.state!=='empty') root.innerHTML='<p class="muted">まだ参加者はいません。</p>';
    root.dataset.state='empty';rankingLoaded=true;return;
  }
  root.dataset.state='rows';
  list.forEach((u,i)=>{
    let row=root.children[i];
    if(!row||!row.classList.contains('rank-item')){
      row=document.createElement('div');
      row.innerHTML='<span class="rank-num"></span><img class="rank-avatar" alt=""><span class="rank-name"></span><strong><span class="rank-points"></span> <small>pt</small></strong>';
      if(root.children[i])root.insertBefore(row,root.children[i]);else root.appendChild(row);
    }
    row.className=`rank-item full-rank-item ${i===0?'rank-first':i===1?'rank-second':i===2?'rank-third':''}`;
    const num=row.querySelector('.rank-num');if(num.textContent!==String(i+1))num.textContent=String(i+1);
    const img=row.querySelector('.rank-avatar'),src=avatarSrc(u.avatar_key);if(img.getAttribute('src')!==src)img.src=src;
    const name=row.querySelector('.rank-name'),nextName=String(u.username??'');if(name.textContent!==nextName)name.textContent=nextName;
    const points=row.querySelector('.rank-points'),nextPoints=Number(u.points).toLocaleString();if(points.textContent!==nextPoints)points.textContent=nextPoints;
  });
  while(root.children.length>list.length)root.lastElementChild.remove();
  rankingLoaded=true;
}
async function loadRanking(){
  const root=$('#fullRanking');
  if(!rankingLoaded)root.innerHTML='<p class="muted">ランキングを読み込み中...</p>';
  try{
    const r=await fetch('/api/ranking',{cache:'no-store'});const rows=await r.json();if(!r.ok)throw new Error(rows.error||'取得に失敗しました');
    renderRanking(rows);
  }catch(e){if(!rankingLoaded)root.innerHTML=`<p class="error">ランキングを取得できませんでした：${esc(e.message)}</p>`}
}
function renderPartyRanking(rows){
  const root=$('#fullRanking');root.innerHTML='';
  if(!rows.length){root.innerHTML='<p class="muted">まだパーティーがありません。</p>';return;}
  rows.slice(0,100).forEach((p,i)=>{
    const row=document.createElement('button');row.type='button';row.className=`rank-item full-rank-item party-rank-item ${i===0?'rank-first':i===1?'rank-second':i===2?'rank-third':''}`;
    row.innerHTML=`<span class="rank-num">${i+1}</span><span class="rank-name">${esc(p.name)}</span><strong><span class="rank-points">${Number(p.points).toLocaleString()}</span> <small>pt</small></strong>`;
    row.addEventListener('click',()=>showPartyDetail(p.id));root.appendChild(row);
  });
}
async function showPartyDetail(id){
  const box=$('#partyDetail');box.hidden=false;$('#partyDetailName').textContent='パーティー詳細';$('#partyDetailPoints').textContent='—';$('#partyDetailBody').textContent='読み込み中...';
  box.scrollIntoView({behavior:'smooth',block:'start'});
  try{
    const r=await fetch('/api/party/detail/'+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得に失敗しました');
    const p=d.party;$('#partyDetailName').textContent=p.name;$('#partyDetailPoints').textContent=Number(p.points).toLocaleString()+' pt';
    const stats=d.stats||{}, players=stats.players||[];
    const gameLabels={janken:'ジャンケン',chinchiro:'チンチロ',hitblow:'ヒット＆ブロー',custom:'カスタム対戦',other:'その他'};
    const rate=x=>{const w=Number(x?.wins)||0,l=Number(x?.losses)||0;return w+l?Math.round(w/(w+l)*100)+'%':'—'};
    const gamesTable=(byGame,showTotal=true)=>{
      const keys=Object.keys(gameLabels), rows=keys.map(key=>({key,label:gameLabels[key],stat:byGame?.[key]||{wins:0,draws:0,losses:0}}));
      const sum=rows.reduce((a,x)=>({wins:a.wins+Number(x.stat.wins),draws:a.draws+Number(x.stat.draws),losses:a.losses+Number(x.stat.losses)}),{wins:0,draws:0,losses:0});
      const row=x=>`<div class="party-game-row${x.key==='total'?' is-total':''}"><span>${x.label}</span><strong>${rate(x.stat)}</strong><small>${Number(x.stat.wins)} / ${Number(x.stat.draws)} / ${Number(x.stat.losses)}</small></div>`;
      return `<div class="party-game-table"><div class="party-game-head"><span>GAME</span><span>勝率</span><span>勝 / 分 / 敗</span></div>${rows.filter(x=>x.key!=='other'||x.stat.wins+x.stat.draws+x.stat.losses>0).map(row).join('')}${showTotal?row({key:'total',label:'総合',stat:sum}):''}</div>`;
    };
    const total={wins:Number(p.wins),draws:Number(p.draws),losses:Number(p.losses)};
    const current=d.members||[];
    const playerCard=m=>{
      const r=players.find(x=>x.userId!=null&&String(x.userId)===String(m.id))||{points:0,wins:0,draws:0,losses:0};
      return `<article class="party-player-card"><div class="party-player-head"><strong>${esc(m.username)}</strong><span>貢献 ${Number(r.points)} pt</span></div><div class="party-player-summary">総合勝率 <strong>${rate(r)}</strong> <small>${Number(r.wins)}勝 ${Number(r.draws)}分 ${Number(r.losses)}敗</small></div>${gamesTable(r.byGame,false)}</article>`;
    };
    const old=players.filter(x=>!current.some(m=>x.userId!=null&&String(m.id)===String(x.userId)));
    $('#partyDetailBody').innerHTML=`<h3>パーティー総合・ゲーム別戦績</h3>${gamesTable(stats.byGame)}<h3>所属メンバーの戦績</h3>${current.length?`<div class="party-detail-member-picker">${current.map((m,i)=>`<button type="button" class="${i===0?'selected':''}" data-party-member="${i}">${esc(m.username)}</button>`).join('')}</div><div id="partySelectedMember">${playerCard(current[0])}</div>`:'<p class="muted">現在所属しているメンバーはいません。</p>'}${old.length?`<h3>過去メンバーの貢献記録</h3>${old.map(x=>`<p class="party-detail-row">${esc(x.name)} <small>${Number(x.points)} pt / ${Number(x.wins)}勝 ${Number(x.draws)}分 ${Number(x.losses)}敗</small></p>`).join('')}`:''}<p class="muted">勝率は引き分けを除いて算出。対象は異なるパーティー間の対戦です。</p>`;
    $('#partyDetailBody').querySelectorAll('[data-party-member]').forEach(btn=>btn.addEventListener('click',()=>{
      const i=Number(btn.dataset.partyMember);
      if(!current[i])return;
      $('#partyDetailBody').querySelectorAll('[data-party-member]').forEach(b=>b.classList.toggle('selected',b===btn));
      $('#partySelectedMember').innerHTML=playerCard(current[i]);
    }));
  }catch(e){$('#partyDetailBody').innerHTML=`<p class="error">${esc(e.message)}</p>`}
}
async function loadPartyRanking(){
  const root=$('#fullRanking');if(!partyRows.length)root.innerHTML='<p class="muted">ランキングを読み込み中...</p>';
  try{const r=await fetch('/api/party/ranking',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得に失敗しました');partyRows=d;renderPartyRanking(d)}
  catch(e){root.innerHTML=`<p class="error">ランキングを取得できませんでした：${esc(e.message)}</p>`}
}
function setTab(tab){
  currentTab=tab;history.replaceState(null,'',tab==='party'?'/ranking?tab=party':'/ranking');
  $('#individualTab').classList.toggle('active',tab==='individual');$('#partyTab').classList.toggle('active',tab==='party');
  $('#individualTab').setAttribute('aria-pressed',String(tab==='individual'));$('#partyTab').setAttribute('aria-pressed',String(tab==='party'));
  $('#rankingTitle').textContent=tab==='party'?'PARTY RANKING':'TOP 100 RANKING';
  $('#rankingDescription').textContent=tab==='party'?'パーティーの上位100組を表示しています。':'現在の上位100名を表示しています。';
  $('#partyDetail').hidden=true;
  if(tab==='party')loadPartyRanking();else{rankingLoaded=false;$('#fullRanking').innerHTML='';loadRanking()}
}
$('#individualTab').onclick=()=>setTab('individual');$('#partyTab').onclick=()=>setTab('party');
$('#closePartyDetail').onclick=()=>{$('#partyDetail').hidden=true};
$('#refreshRanking').onclick=()=>currentTab==='party'?loadPartyRanking():loadRanking();
setTab(currentTab);setInterval(()=>{if(currentTab==='party'){if($('#partyDetail').hidden)loadPartyRanking()}else loadRanking()},12000);
</script>
</body>
</html>
