<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02050b">
  <title>RANKING | NEXUS:ZERO</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="player-page v52-player ranking-page">
<div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="cyber-orbit orbit-b"></div><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><a class="active" href="/ranking">RANKING</a><a href="/admin">STAFF</a></div></nav>
<main class="app-shell arena-shell ranking-shell">
  <section class="ranking-hero system-panel">
    <div class="eyebrow">LIVE STANDINGS</div>
    <h1>TOP 100 RANKING</h1>
    <p class="muted">現在の上位100名を表示しています。</p>
    <button id="refreshRanking" class="secondary compact">今すぐ更新</button>
  </section>
  <section class="system-panel top100-panel">
    <div id="fullRanking"><p class="muted">ランキングを読み込み中...</p></div>
  </section>
  <nav class="bottom-arena-nav" aria-label="ページナビゲーション">
    <button type="button" onclick="location.href='/'"><b>⌂</b><span>HOME</span><small>ホーム</small></button>
    <button type="button" class="active"><b>▥</b><span>RANKING</span><small>ランキング</small></button>
    <button type="button" onclick="location.href='/history'"><b>◷</b><span>HISTORY</span><small>履歴</small></button>
  </nav>
</main>
<script>
const $=s=>document.querySelector(s);
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function avatarSrc(key){return `/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(String(key||''))?key:'avatar-01'}.webp`}
async function loadRanking(){
  $('#fullRanking').innerHTML='<p class="muted">ランキングを読み込み中...</p>';
  try{
    const r=await fetch('/api/ranking',{cache:'no-store'});const rows=await r.json();if(!r.ok)throw new Error(rows.error||'取得に失敗しました');
    $('#fullRanking').innerHTML=rows.length?rows.slice(0,100).map((u,i)=>`<div class="rank-item full-rank-item ${i===0?'rank-first':i===1?'rank-second':i===2?'rank-third':''}"><span class="rank-num">${i+1}</span><img class="rank-avatar" src="${avatarSrc(u.avatar_key)}" alt=""><span class="rank-name">${esc(u.username)}<small>ID ${esc(u.public_code)}</small></span><strong>${Number(u.points).toLocaleString()} <small>pt</small></strong></div>`).join(''):'<p class="muted">まだ参加者はいません。</p>';
  }catch(e){$('#fullRanking').innerHTML=`<p class="error">ランキングを取得できませんでした：${esc(e.message)}</p>`}
}
$('#refreshRanking').onclick=loadRanking;loadRanking();setInterval(loadRanking,12000);
</script>
</body>
</html>
