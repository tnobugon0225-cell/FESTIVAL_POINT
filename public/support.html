<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営への問い合わせ | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><style>.support-shell{max-width:600px;margin:60px auto;padding:24px;background:#071225;border:1px solid #435080;border-radius:16px}.support-shell label{display:block;margin:16px 0 6px}.support-shell select,.support-shell textarea{width:100%;padding:12px;background:#101b32;color:white;border:1px solid #596990;border-radius:8px}.support-shell button{margin-top:20px;width:100%}</style></head><body><nav class="topbar"><a href="/" class="brand-mini">NEXUS:ZERO</a></nav><main class="support-shell"><div class="eyebrow">PLAYER SUPPORT</div><h1>運営への問い合わせ</h1><p>質問・不具合・改善点などを運営に送れます。</p><label for="category">種類</label><select id="category"><option value="question">質問・ルール確認</option><option value="bug">不具合報告</option><option value="idea">改善提案</option><option value="other">その他</option></select><label for="body">内容（1000文字以内）</label><textarea id="body" maxlength="1000" rows="7" placeholder="運営に伝えたい内容を入力してください"></textarea><button id="send" class="primary-action">運営に送信</button><p id="msg" role="status"></p><a href="/">ホームに戻る</a></main><script>document.querySelector('#send').onclick=async()=>{const btn=document.querySelector('#send'),msg=document.querySelector('#msg'),body=document.querySelector('#body').value.trim();if(!body){msg.textContent='内容を入力してください';return}btn.disabled=true;try{const token=localStorage.getItem('nexusParticipantToken');const r=await fetch('/api/support/messages',{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({category:document.querySelector('#category').value,body})});const d=await r.json();if(!r.ok)throw Error(d.error||'送信できませんでした');msg.textContent='送信しました。ありがとうございます！';document.querySelector('#body').value=''}catch(e){msg.textContent=e.message}finally{btn.disabled=false}};</script></body></html>
