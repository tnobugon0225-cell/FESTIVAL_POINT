<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営への問い合わせ | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css">
<style>
.support-shell{max-width:640px;margin:35px auto;padding:clamp(16px,4vw,26px);background:#071225;border:1px solid #435080;border-radius:16px;color:#f1f6ff}
.support-shell label{display:block;margin:16px 0 6px}.support-shell select,.support-shell textarea{box-sizing:border-box;width:100%;padding:12px;background:#101b32;color:white;border:1px solid #596990;border-radius:8px;font:inherit}
.support-send{display:block;margin:18px auto 10px;padding:0;border:0;background:transparent;cursor:pointer;width:min(100%,340px);min-height:60px;filter:drop-shadow(0 0 8px rgba(92,195,255,.35))}
.support-send img{display:block;width:100%;height:auto;max-height:110px;object-fit:contain}.support-send:disabled{opacity:.45;cursor:wait}.support-send:focus-visible{outline:2px solid #81d9ff;outline-offset:4px}
.support-item{padding:14px;margin:12px 0;border:1px solid #354b6c;border-radius:12px;background:#0c1931;overflow-wrap:anywhere}
.support-item p{white-space:pre-wrap;margin:10px 0}.support-reply{margin-top:12px;padding:12px;border-left:3px solid #65dbff;background:#122642}
.support-meta{color:#a5b9d5;font-size:12px}.support-status{color:#9be2ff;font-size:12px}.support-shell h2{margin-top:30px}.support-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
</style></head>
<body><nav class="topbar"><a href="/" class="brand-mini">NEXUS:ZERO</a></nav>
<main class="support-shell"><div class="eyebrow">PLAYER SUPPORT</div><h1>運営への問い合わせ</h1><p>質問・不具合・改善点などを運営に送れます。</p>
<label for="category">種類</label><select id="category"><option value="question">質問・ルール確認</option><option value="bug">不具合報告</option><option value="idea">改善提案</option><option value="other">その他</option></select>
<label for="body">内容（1000文字以内）</label><textarea id="body" maxlength="1000" rows="6" placeholder="運営に伝えたい内容を入力してください"></textarea>
<button id="send" class="support-send" type="button" aria-label="運営にメッセージを送信"><img src="/ui/send.webp" alt="SEND"></button><p id="msg" role="status" aria-live="polite"></p>
<section aria-labelledby="inboxTitle"><div class="support-actions"><h2 id="inboxTitle">送信した問い合わせ・運営からの返信</h2><button id="refresh" class="secondary compact" type="button">更新</button></div><div id="myMessages" aria-live="polite">読み込み中...</div></section>
<a href="/">ホームに戻る</a></main>
<script>
const token=localStorage.getItem('nexusParticipantToken')||'';
const authHeaders=()=>({'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})});
const esc=s=>{const el=document.createElement('span');el.textContent=s??'';return el.innerHTML};
const fmt=s=>s?new Date(s).toLocaleString('ja-JP'):'';
const kinds={question:'質問・ルール確認',bug:'不具合報告',idea:'改善提案',other:'その他'};
async function loadMyMessages(){const list=document.querySelector('#myMessages');try{const r=await fetch('/api/support/messages',{headers:authHeaders(),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得できませんでした');list.innerHTML=d.length?d.map(m=>`<article class="support-item"><div class="support-meta">${esc(kinds[m.category]||m.category)} / ${fmt(m.created_at)}</div><p>${esc(m.body)}</p><div class="support-status">${m.status==='resolved'?'対応済み':'対応中'}</div>${m.staff_reply?`<div class="support-reply"><strong>運営からの返信</strong><div class="support-meta">${fmt(m.replied_at)}</div><p>${esc(m.staff_reply)}</p></div>`:''}</article>`).join(''):'<p>まだ問い合わせはありません。</p>'}catch(e){list.textContent=e.message}}
document.querySelector('#send').onclick=async()=>{const btn=document.querySelector('#send'),msg=document.querySelector('#msg'),body=document.querySelector('#body').value.trim();if(!body){msg.textContent='内容を入力してください';return}btn.disabled=true;msg.textContent='送信中...';try{const r=await fetch('/api/support/messages',{method:'POST',headers:authHeaders(),body:JSON.stringify({category:document.querySelector('#category').value,body})});const d=await r.json();if(!r.ok)throw Error(d.error||'送信できませんでした');msg.textContent='送信しました。返信はこのページで確認できます。';document.querySelector('#body').value='';await loadMyMessages()}catch(e){msg.textContent=e.message}finally{btn.disabled=false}};
document.querySelector('#refresh').onclick=loadMyMessages;
loadMyMessages();
</script></body></html>
