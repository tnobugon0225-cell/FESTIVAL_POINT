<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運営への問い合わせ | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css">
<style>
.support-shell{max-width:640px;margin:35px auto;padding:clamp(16px,4vw,26px);background:#071225;border:1px solid #435080;border-radius:16px;color:#f1f6ff}
.support-shell label{display:block;margin:16px 0 6px}.support-shell select,.support-shell textarea,.support-shell input{box-sizing:border-box;width:100%;padding:12px;background:#101b32;color:white;border:1px solid #596990;border-radius:8px;font:inherit}
.support-send{display:block;margin:18px auto 10px;padding:0;border:0;background:transparent;cursor:pointer;width:min(100%,340px);min-height:60px;filter:none!important;box-shadow:none!important;appearance:none;-webkit-appearance:none}
.support-send:hover,.support-send:active,.support-send:focus{background:transparent!important;box-shadow:none!important;filter:none!important}.support-send img{box-shadow:none!important;filter:none!important}.support-send::before,.support-send::after{display:none!important;content:none!important}.support-send img{display:block;width:100%;height:auto;max-height:110px;object-fit:contain}.support-send:disabled{opacity:.45;cursor:wait}.support-send:focus-visible{outline:2px solid #81d9ff;outline-offset:4px}
.support-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.support-tabs button[aria-pressed="true"]{border-color:#79dfff!important;box-shadow:inset 0 0 0 1px #79dfff;color:#d7faff}.support-item{padding:14px;margin:12px 0;border:1px solid #354b6c;border-radius:12px;background:#0c1931;overflow-wrap:anywhere}
.support-item p{white-space:pre-wrap;margin:10px 0}.support-item summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}.support-item summary::-webkit-details-marker{display:none}.support-item summary::after{content:"＋";font-size:22px;color:#91ddff;flex-shrink:0}.support-item[open] summary::after{content:"−"}.support-item .support-title{font-weight:700;font-size:16px;overflow-wrap:anywhere}.support-item .support-content{padding-top:12px;border-top:1px solid #314565;margin-top:12px}.support-reply{margin-top:12px;padding:12px;border-left:3px solid #65dbff;background:#122642}
.support-thread{margin:10px 0}.support-thread-entry{margin:8px 0;padding:10px 12px;border-radius:10px;background:#132943;border:1px solid #284564}.support-thread-entry.staff{border-left:3px solid #69dfff}.support-thread-entry.player{border-left:3px solid #b39cff}.support-thread-entry p{margin:6px 0;white-space:pre-wrap}.support-reply-form{margin-top:12px}.support-reply-form textarea{min-height:72px}.support-reply-form button{margin-top:8px}.support-meta{color:#a5b9d5;font-size:12px}.support-status{color:#9be2ff;font-size:12px}.support-shell h2{margin-top:30px}.support-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
</style></head>
<body><nav class="topbar"><a href="/" class="brand-mini">NEXUS:ZERO</a></nav>
<main class="support-shell"><div class="eyebrow">PLAYER SUPPORT</div><h1>運営への問い合わせ</h1><p>質問・不具合・改善点などを運営に送れます。</p>
<label for="category">種類</label><select id="category"><option value="question">質問・ルール確認</option><option value="bug">不具合報告</option><option value="idea">改善提案</option><option value="other">その他</option></select>
<label for="title">タイトル（必須・40文字以内）</label><input id="title" maxlength="40" placeholder="例：ポイントが反映されない" required>
<label for="body">内容（1000文字以内）</label><textarea id="body" maxlength="1000" rows="6" placeholder="運営に伝えたい内容を入力してください"></textarea>
<button id="send" class="support-send" type="button" aria-label="運営にメッセージを送信"><img src="/ui/send.webp" alt="SEND"></button><p id="msg" role="status" aria-live="polite"></p>
<section aria-labelledby="inboxTitle"><div class="support-actions"><h2 id="inboxTitle">送信した問い合わせ・運営からの返信</h2><button id="refresh" class="secondary compact" type="button">更新</button></div><div class="support-tabs" role="group" aria-label="問い合わせの表示切り替え"><button id="playerSupportOpen" class="secondary compact" type="button" aria-pressed="true">進行中</button><button id="playerSupportResolved" class="secondary compact" type="button" aria-pressed="false">過去の問い合わせ</button></div><div id="myMessages" aria-live="polite">読み込み中...</div></section>
<a href="/">ホームに戻る</a></main>
<script>
const token=localStorage.getItem('nexusParticipantToken')||'';
const authHeaders=()=>({'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})});
const esc=s=>{const el=document.createElement('span');el.textContent=s??'';return el.innerHTML};
const fmt=s=>s?new Date(s).toLocaleString('ja-JP'):'';
const kinds={question:'質問・ルール確認',bug:'不具合報告',idea:'改善提案',other:'その他'};
let playerSupportTab='open';
let playerMessages=[];
const supportTitle=m=>(m.title&&m.title.trim())||((m.body||'').trim().slice(0,40))||'以前の問い合わせ';
function setPlayerSupportTab(tab){
  playerSupportTab=tab;
  for(const [id,value] of [['playerSupportOpen','open'],['playerSupportResolved','resolved']]){
    const b=document.getElementById(id);b.setAttribute('aria-pressed',String(tab===value));
  }
  renderMyMessages();
}
document.querySelector('#playerSupportOpen').onclick=()=>setPlayerSupportTab('open');
document.querySelector('#playerSupportResolved').onclick=()=>setPlayerSupportTab('resolved');
function renderMyMessages(){
  const list=document.querySelector('#myMessages');
  document.querySelector('#playerSupportOpen').textContent=`進行中 (${playerMessages.filter(m=>m.status==='open').length})`;
  document.querySelector('#playerSupportResolved').textContent=`過去の問い合わせ (${playerMessages.filter(m=>m.status==='resolved').length})`;
  const d=playerMessages.filter(m=>m.status===playerSupportTab);
  const expanded=new Set([...list.querySelectorAll('details.support-item[open]')].map(el=>el.dataset.id));
  list.innerHTML=d.length?d.map(m=>{
    const legacy=m.staff_reply?`<div class="support-thread-entry staff"><strong>運営からの返信</strong><div class="support-meta">${fmt(m.replied_at)}</div><p>${esc(m.staff_reply)}</p></div>`:'';
    const entries=(m.thread||[]).map(e=>`<div class="support-thread-entry ${e.sender_role==='staff'?'staff':'player'}"><strong>${e.sender_role==='staff'?'運営':'あなた'}</strong><div class="support-meta">${fmt(e.created_at)}</div><p>${esc(e.body)}</p></div>`).join('');
    return `<details class="support-item" data-id="${Number(m.id)}" ${expanded.has(String(m.id))?'open':''}><summary><span><span class="support-title">${esc(supportTitle(m))}</span><br><span class="support-meta">${esc(kinds[m.category]||m.category)} / ${fmt(m.created_at)}</span><br><span class="support-status">${m.status==='resolved'?'対応済み':'対応中'}</span></span></summary><div class="support-content"><p>${esc(m.body)}</p><div class="support-thread">${legacy}${entries}</div><form class="support-reply-form" data-id="${Number(m.id)}"><label for="reply-${Number(m.id)}">この問い合わせに返信する${m.status==='resolved'?'（送信すると進行中に戻ります）':''}</label><textarea id="reply-${Number(m.id)}" maxlength="1000" placeholder="返信を入力してください" required></textarea><button class="secondary compact" type="submit">返信を送信</button><span class="support-meta" role="status"></span></form></div></details>`;
  }).join(''):`<p>${playerSupportTab==='open'?'進行中の問い合わせはありません。':'過去の問い合わせはありません。'}</p>`;
}
async function loadMyMessages(){
  const list=document.querySelector('#myMessages');
  try{
    const r=await fetch('/api/support/messages',{headers:authHeaders(),cache:'no-store'});
    const d=await r.json();if(!r.ok)throw Error(d.error||'取得できませんでした');
    if(!Array.isArray(d))throw Error('問い合わせの形式が正しくありません');
    playerMessages=d;
    renderMyMessages();
  }catch(e){list.textContent=e.message}
}
document.querySelector('#myMessages').addEventListener('submit',async e=>{
  const form=e.target.closest('.support-reply-form');if(!form)return;e.preventDefault();
  const body=form.querySelector('textarea').value.trim(),btn=form.querySelector('button'),msg=form.querySelector('[role="status"]');
  if(!body)return;btn.disabled=true;msg.textContent='送信中...';
  try{
    const r=await fetch(`/api/support/messages/${form.dataset.id}/reply`,{method:'POST',headers:authHeaders(),body:JSON.stringify({body})});
    const d=await r.json();if(!r.ok)throw Error(d.error||'送信できませんでした');
    playerSupportTab='open';
    document.querySelector('#playerSupportOpen').setAttribute('aria-pressed','true');
    document.querySelector('#playerSupportResolved').setAttribute('aria-pressed','false');
    await loadMyMessages();
  }catch(err){msg.textContent=err.message;btn.disabled=false}
});
document.querySelector('#send').onclick=async()=>{const btn=document.querySelector('#send'),msg=document.querySelector('#msg'),body=document.querySelector('#body').value.trim(),title=document.querySelector('#title').value.trim();if(!title||Array.from(title).length>40){msg.textContent='タイトルを1〜40文字で入力してください';return}if(!body){msg.textContent='内容を入力してください';return}btn.disabled=true;msg.textContent='送信中...';try{const r=await fetch('/api/support/messages',{method:'POST',headers:authHeaders(),body:JSON.stringify({category:document.querySelector('#category').value,body,title})});const d=await r.json();if(!r.ok)throw Error(d.error||'送信できませんでした');msg.textContent='送信しました。返信はこのページで確認できます。';document.querySelector('#body').value='';document.querySelector('#title').value='';playerSupportTab='open';document.querySelector('#playerSupportOpen').setAttribute('aria-pressed','true');document.querySelector('#playerSupportResolved').setAttribute('aria-pressed','false');await loadMyMessages()}catch(e){msg.textContent=e.message}finally{btn.disabled=false}};
document.querySelector('#refresh').onclick=loadMyMessages;
loadMyMessages();
</script></body></html>
