<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVE SPECTATE // NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script></head><body class="player-page watch-page"><main class="app-shell"><section class="system-panel"><div class="panel-head"><div><div class="eyebrow">LIVE SPECTATE</div><h1>観戦リンク</h1></div><a href="/network#live" class="secondary">戻る</a></div><div id="watchStage"></div></section></main><script>const $=s=>document.querySelector(s),t=localStorage.getItem('nexusParticipantToken')||'',q=new URLSearchParams(location.search),id=Number(q.get('id'));let lastWatchSig='';if(!t||!id)location.href='/';const api=async u=>{const r=await fetch(u,{cache:'no-store',headers:{'X-Participant-Token':t,Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw new Error(d.error||'error');return d};const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const av=k=>`/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(k||'')?k:'avatar-01'}.webp`;function diceImg(n){return `/dice/dice-${n}.webp`}function render(d){const sig=JSON.stringify([d.match?.id,d.match?.status,d.match?.winnerUserId,d.match?.turnNo,d.match?.jankenRoundNo,d.match?.chinchiroRoundNo,d.guesses?.map(x=>[x.turn_no,x.guess,x.hits,x.blows]),d.rounds?.map(x=>[x.round_no,x.challenger_choice,x.opponent_choice,x.result]),d.rolls?.map(x=>[x.round_no,x.player_id,x.attempt_no,x.dice,x.role,x.role_value])]);if(sig===lastWatchSig)return;lastWatchSig=sig;const m=d.match;let body='';if(m.gameType==='hitblow')body=`<div class="spectate-log">${d.guesses.slice(-8).reverse().map(g=>`<div><b>${esc(g.player_name)}</b><span>${g.guess.split('').join(' ')}</span><em>${g.hits}H / ${g.blows}B</em></div>`).join('')}</div>`;else if(m.gameType==='janken')body=`<div class="spectate-log">${d.rounds.slice(-6).reverse().map(r=>`<div><b>ROUND ${r.round_no}</b><span>${r.challenger_choice} VS ${r.opponent_choice}</span><em>${r.result.toUpperCase()}</em></div>`).join('')}</div>`;else body=`<div class="spectate-log">${d.rolls.slice(-6).reverse().map(r=>`<div><b>${esc(r.player_name)}</b><span class="spectate-dice">${String(r.dice).split(',').map(n=>`<img src="${diceImg(n)}">`).join('')}</span><em>${esc(r.role).toUpperCase()}</em></div>`).join('')}</div>`;$('#watchStage').innerHTML=`<div class="watch-vs"><div><img src="${av(m.challenger.avatarKey)}"><strong>${esc(m.challenger.name)}</strong><img class="watch-title" src="/titles/${m.challenger.titleKey||'rookie'}.webp"></div><b>VS</b><div><img src="${av(m.opponent.avatarKey)}"><strong>${esc(m.opponent.name)}</strong><img class="watch-title" src="/titles/${m.opponent.titleKey||'rookie'}.webp"></div></div><div class="watch-meta"><strong>${m.gameType.toUpperCase()}</strong><span>${m.wager} BATTLE POINTS</span><em>${m.status}</em></div>${body}`}
async function load(){try{render(await api('/api/spectate/quick/'+id))}catch(e){$('#watchStage').innerHTML='<p>'+esc(e.message)+'</p>'}}setInterval(load,1200);load();</script></body></html>
