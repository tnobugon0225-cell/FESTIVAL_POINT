<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02050b">
  <title>HISTORY | NEXUS:ZERO</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/bgm.js" defer></script>
  <script src="/ui-fx.js" defer></script>
</head>
<body class="player-page v52-player history-page">
<div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="cyber-orbit orbit-b"></div><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/" data-nexus-nav="HOME"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><a href="/ranking">RANKING</a><a href="/admin">STAFF</a></div></nav>
<main class="app-shell arena-shell history-shell">
  <section class="ranking-hero system-panel history-hero">
    <div class="eyebrow">ACTIVITY LOG</div>
    <h1>HISTORY</h1>
    <p class="muted">あなたのポイント変動履歴</p>
    <button id="refreshHistory" class="secondary compact">今すぐ更新</button>
  </section>
  <section class="system-panel history-full-panel">
    <div id="fullHistory"><p class="muted">履歴を読み込み中...</p></div>
  </section>
  <nav class="bottom-arena-nav" aria-label="ページナビゲーション">
    <button type="button" data-href="/" data-nexus-nav="HOME"><b>⌂</b><span>HOME</span><small>ホーム</small></button>
    <button type="button" data-href="/ranking" data-nexus-nav="RANKING"><b>▥</b><span>RANKING</span><small>ランキング</small></button>
    <button type="button" class="active"><b>◷</b><span>HISTORY</span><small>履歴</small></button>
  </nav>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>window.NexusBGM?.setTrack('home'));
const $=s=>document.querySelector(s);let authToken=localStorage.getItem('nexusParticipantToken')||'';
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function fmt(s){if(!s)return '';const v=String(s);return new Date(v.includes('T')?v:v.replace(' ','T')+'Z').toLocaleString('ja-JP')}
function historyLabel(h){if(h.action_type==='participant_transfer_out')return `譲渡 → ${esc(h.counterpart||'相手')}`;if(h.action_type==='participant_transfer_in')return `獲得 ← ${esc(h.counterpart||'相手')}`;if(h.action_type==='transfer_out')return `スタッフ移動 → ${esc(h.counterpart||'相手')}`;if(h.action_type==='transfer_in')return `スタッフ移動 ← ${esc(h.counterpart||'相手')}`;if(h.action_type==='match_win')return `勝利 ← ${esc(h.counterpart||'相手')}`;if(h.action_type==='match_loss')return `敗北 → ${esc(h.counterpart||'相手')}`;return '運営調整'}
async function api(url){const headers={};if(authToken){headers['X-Participant-Token']=authToken;headers.Authorization='Bearer '+authToken}const r=await fetch(url,{credentials:'same-origin',cache:'no-store',headers});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'通信に失敗しました');e.status=r.status;throw e}return d}
async function loadHistory(){
  $('#fullHistory').innerHTML='<p class="muted">履歴を読み込み中...</p>';
  try{
    const hist=await api('/api/my-history');
    $('#fullHistory').innerHTML=hist.length?hist.map(h=>`<div class="history-item history-page-item"><div><div class="history-type">${historyLabel(h)}</div><strong class="delta ${h.delta>0?'plus':'minus'}">${h.delta>0?'+':''}${Number(h.delta).toLocaleString()} pt</strong>${h.reason?`<div class="reason">${esc(h.reason)}</div>`:''}</div><div class="muted small">${fmt(h.created_at)}</div></div>`).join(''):'<p class="muted">まだ履歴はありません。</p>';
  }catch(e){
    if(e.status===401||e.status===403){location.href='/';return}
    $('#fullHistory').innerHTML=`<p class="error">履歴を取得できませんでした：${esc(e.message)}</p>`;
  }
}
$('#refreshHistory').onclick=loadHistory;loadHistory();setInterval(loadHistory,12000);
</script>
</body>
</html>
