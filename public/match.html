<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050b"><title>BATTLE | NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script><script src="/ui-fx.js" defer></script></head>
<body class="player-page match-page">
<div class="cyber-bg" aria-hidden="true"><div class="cyber-orbit orbit-a"></div><div class="cyber-orbit orbit-b"></div><div class="scanline"></div></div>
<nav class="topbar"><a class="brand-mini" href="/"><span class="brand-pulse"></span>NEXUS:ZERO</a><div class="nav-links"><span class="match-live-nav">BATTLE LINK</span></div></nav>
<main class="match-screen-shell">
  <section id="matchScreen" class="match-screen state-loading">
    <div class="match-screen-grid" aria-hidden="true"></div>
    <div class="match-screen-top"><span id="stateKicker">CONNECTING</span><strong id="stateBadge">...</strong></div>
    <div class="match-stage-core">
      <div class="match-stage-orbit" aria-hidden="true"></div>
      <h1 id="stateTitle">MATCH DATA LOADING</h1>
      <p id="stateSubtitle">対戦情報を同期しています</p>
    </div>
    <div id="battlePlayers" class="battle-player-row"></div>
    <div id="battleMeta" class="battle-meta"></div>
    <div id="battleControls" class="battle-controls"></div>
    <p id="battleMsg" class="match-action-msg"></p>
    <button id="backHome" class="ghost match-home-btn" type="button">HOMEへ戻る</button>
  </section>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>window.NexusBGM?.setTrack('matching'));
const $=s=>document.querySelector(s);let authToken=localStorage.getItem('nexusParticipantToken')||'',timer=null,startTimer=null,lastStatus='',resultReturnTimer=null,resultCountdownTimer=null,resultReturnMatchId=null,judging=false,introRunning=false;
async function api(url,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(authToken){headers['X-Participant-Token']=authToken;headers.Authorization='Bearer '+authToken}let r;try{r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options,headers})}catch(e){const x=new Error('ネットワーク通信に失敗しました');x.status=0;throw x}const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'通信に失敗しました');e.status=r.status;throw e}return d}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
function avatarSrc(key){return `/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(String(key||''))?key:'avatar-01'}.webp`}
function person(p,label,result=''){const badge=result==='winner'?'<div class="result-avatar-badge victor-badge">VICTOR</div>':result==='loser'?'<div class="result-avatar-badge defeated-badge">DEFEATED</div><div class="defeat-slash" aria-hidden="true"></div>':'';return `<div class="battle-person ${result?`result-${result}`:''}"><div class="battle-avatar-wrap"><img class="battle-person-avatar" src="${avatarSrc(p.avatarKey)}" alt="">${badge}</div><span>${label}</span><strong>${esc(p.name)}</strong><small>ID ${esc(p.code)}</small></div>`}
function refereeMeta(p){return `<div class="battle-referee-meta"><img src="${avatarSrc(p.avatarKey)}" alt=""><div><span>REFEREE</span><strong>${esc(p.name)}</strong><small>ID ${esc(p.code)}</small></div></div>`}
function setStableHTML(el,html){if(el&&el.innerHTML!==html)el.innerHTML=html}
function resultRemaining(completedAt){const ts=new Date(completedAt).getTime();const end=(Number.isFinite(ts)?ts:Date.now())+10000;return Math.max(0,Math.ceil((end-Date.now())/1000))}
function startResultReturn(matchId,completedAt){if(resultReturnMatchId===matchId&&resultCountdownTimer)return;clearInterval(resultCountdownTimer);clearTimeout(resultReturnTimer);resultReturnMatchId=matchId;const ts=new Date(completedAt).getTime();const end=(Number.isFinite(ts)?ts:Date.now())+10000;const tick=()=>{const remain=Math.max(0,Math.ceil((end-Date.now())/1000));const el=document.querySelector('#resultCountdown');if(el&&el.textContent!==String(remain))el.textContent=remain;if(remain<=0){clearInterval(resultCountdownTimer);resultCountdownTimer=null;location.href='/';}};tick();resultCountdownTimer=setInterval(tick,250);resultReturnTimer=setTimeout(()=>location.href='/',Math.max(0,end-Date.now()+100))}
function setState(cls,kicker,title,subtitle,badge){const s=$('#matchScreen');s.className='match-screen '+cls;$('#stateKicker').textContent=kicker;$('#stateTitle').textContent=title;$('#stateSubtitle').textContent=subtitle;$('#stateBadge').textContent=badge}
function approval(label,ok){return `<span class="approval-chip ${ok?'approved':'waiting'}">${label} ${ok?'✓':'…'}</span>`}
function showBattleIntro(m,onDone){if(introRunning)return;const key=`nexusIntro:custom:${m.id}`;if(sessionStorage.getItem(key)==='1'){onDone();return}sessionStorage.setItem(key,'1');introRunning=true;const o=document.createElement('div');o.className='prebattle-intro';o.innerHTML=`<div class="prebattle-player prebattle-a"><img src="${avatarSrc(m.challenger.avatarKey)}"><strong>${esc(m.challenger.name)}</strong></div><div class="prebattle-vs">VS</div><div class="prebattle-player prebattle-b"><img src="${avatarSrc(m.opponent.avatarKey)}"><strong>${esc(m.opponent.name)}</strong></div>`;document.body.appendChild(o);setTimeout(()=>o.classList.add('show'),30);setTimeout(()=>{o.classList.remove('show');setTimeout(()=>{o.remove();introRunning=false;onDone()},330)},3000)}
async function load(){
 try{
   const me=await api('/api/me');const r=await api('/api/matches/me');const m=r.match;
   if(!m){window.NexusBGM?.setTrack('home');clearInterval(timer);setState('state-idle','NO ACTIVE MATCH','NO ACTIVE BATTLE','進行中の対戦はありません','IDLE');setStableHTML($('#battlePlayers'),'');setStableHTML($('#battleMeta'),'');$('#battleControls').innerHTML='';$('#backHome').classList.remove('hidden');return}
   $('#backHome').classList.toggle('hidden',m.status!=='completed');
   if(m.status!=='completed') setStableHTML($('#battlePlayers'),`${person(m.challenger,'PLAYER A')}<div class="battle-vs">VS</div>${person(m.opponent,'RIVAL')}`);
   setStableHTML($('#battleMeta'),`<div><span>BATTLE POINTS</span><strong>${Number(m.wager).toLocaleString()} pt</strong></div>${refereeMeta(m.referee)}`);
   if(m.status==='pending'){
     window.NexusBGM?.setTrack('matching');
     setState('state-pending','MATCHING','MATCHING IN PROGRESS','承認情報を同期しています','WAITING');
     let controls=`<div class="approval-row">${approval('RIVAL',m.opponentApproved)}${approval('REFEREE',m.refereeApproved)}</div>`;
     if((m.role==='opponent'&&!m.opponentApproved)||(m.role==='referee'&&!m.refereeApproved)) controls+=`<div class="match-actions"><button class="success" onclick="approve(${m.id})">承認する</button><button class="danger" onclick="rejectMatch(${m.id})">拒否する</button></div>`;
     else if(m.role==='challenger') controls+=`<div class="match-actions"><button class="ghost" onclick="rejectMatch(${m.id})">申請を取り消す</button></div>`;
     else controls+=`<p class="battle-wait">もう一方の承認を待っています。</p>`;
     $('#battleControls').innerHTML=controls;
   }else if(m.status==='matched'){
     window.NexusBGM?.setTrack('matching');
     setState('state-matched','MATCHING COMPLETE','LINK ESTABLISHED','対戦リンクを確立しました','MATCHED');$('#battleControls').innerHTML='<div class="link-pulse-text">BATTLE SYSTEM STARTING...</div>';
     if(!startTimer&&!introRunning){startTimer=setTimeout(()=>{startTimer=null;showBattleIntro(m,()=>start(m.id))},120);}
   }else if(m.status==='in_progress'){
     window.NexusBGM?.setTrack('battle');
     setState('state-battle','BATTLE LIVE','BATTLE IN PROGRESS','勝敗が確定するまで対戦を続行してください','LIVE');
     if(m.role==='referee') setStableHTML($('#battleControls'),`<div class="judge-panel match-judge-full"><div class="eyebrow">REFEREE JUDGEMENT</div><h2>勝者を選択</h2><div class="match-actions"><button class="success judge-win-btn" onclick="judge(${m.id},${m.challenger.id},'${encodeURIComponent(m.challenger.name)}')">${esc(m.challenger.name)} 勝利</button><button class="success judge-win-btn" onclick="judge(${m.id},${m.opponent.id},'${encodeURIComponent(m.opponent.name)}')">${esc(m.opponent.name)} 勝利</button></div></div>`);
     else setStableHTML($('#battleControls'),'<div class="battle-wait-large">REFEREE JUDGEMENT WAITING<span>審判の勝利判定を待っています</span></div>');
   }else if(m.status==='completed'){
     window.NexusBGM?.setTrack('victory');
     const mine=m.role==='challenger'?m.challenger:m.role==='opponent'?m.opponent:null;const won=mine&&Number(m.winnerUserId)===Number(mine.id);
     const challengerWon=Number(m.winnerUserId)===Number(m.challenger.id);
     const playerHtml=`${person(m.challenger,'PLAYER A',challengerWon?'winner':'loser')}<div class="battle-vs result-vs">VS</div>${person(m.opponent,'RIVAL',challengerWon?'loser':'winner')}`;
     setStableHTML($('#battlePlayers'),playerHtml);
     if(mine)setState(won?'state-victory':'state-defeat','BATTLE RESULT',won?'VICTORY':'DEFEAT',won?`+${Number(m.wager).toLocaleString()} pt`:`-${Number(m.wager).toLocaleString()} pt`,'COMPLETE');
     else setState('state-complete','BATTLE RESULT','RESULT CONFIRMED',`WINNER : ${m.winnerName}`,'COMPLETE');
     const remain=resultRemaining(m.completedAt);
     const resultHtml=`<div class="winner-line">WINNER <strong>${esc(m.winnerName||'---')}</strong><div class="result-return">HOMEへ戻るまで <b id="resultCountdown">${remain}</b> 秒</div></div>`;
     setStableHTML($('#battleControls'),resultHtml);
     startResultReturn(m.id,m.completedAt);
   }
   lastStatus=m.status;
 }catch(e){if(e.status===401||e.status===403){location.href='/';return}$('#battleMsg').className='match-action-msg error';$('#battleMsg').textContent=e.message}
}
async function approve(id){$('#battleMsg').textContent='承認処理中...';try{await api(`/api/matches/${id}/approve`,{method:'POST'});$('#battleMsg').className='match-action-msg ok';$('#battleMsg').textContent='承認しました';await load()}catch(e){$('#battleMsg').className='match-action-msg error';$('#battleMsg').textContent=`承認できませんでした：${e.message}`}}
async function rejectMatch(id){if(!confirm('この対戦申請を拒否／取消しますか？'))return;try{await api(`/api/matches/${id}/reject`,{method:'POST'});location.href='/'}catch(e){$('#battleMsg').className='match-action-msg error';$('#battleMsg').textContent=e.message}}
async function start(id){startTimer=null;try{await api(`/api/matches/${id}/start`,{method:'POST'});await load()}catch(e){}}
async function judge(id,winnerId,nameEncoded){if(judging)return;const name=decodeURIComponent(nameEncoded);if(!confirm(`${name} の勝利で確定しますか？`))return;judging=true;document.querySelectorAll('.judge-win-btn').forEach(b=>b.disabled=true);$('#battleMsg').className='match-action-msg';$('#battleMsg').textContent='勝敗を確定しています...';try{await api(`/api/matches/${id}/result`,{method:'POST',body:JSON.stringify({winnerId})});clearInterval(timer);await load()}catch(e){judging=false,introRunning=false;document.querySelectorAll('.judge-win-btn').forEach(b=>b.disabled=false);$('#battleMsg').className='match-action-msg error';$('#battleMsg').textContent=e.message}}
$('#backHome').onclick=()=>location.href='/';load();timer=setInterval(load,2000);
</script></body></html>
