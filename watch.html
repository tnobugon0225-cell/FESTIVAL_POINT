<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVE SPECTATE // NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script></head><body class="player-page watch-page"><main class="app-shell"><section class="system-panel"><div class="panel-head"><div><div class="eyebrow">LIVE SPECTATE</div><h1>観戦リンク</h1></div><a href="/network#live" class="asset-back-link" aria-label="BACK"><img src="/ui/v576/back.webp" alt="BACK"></a></div><div id="watchStage"></div></section></main><script>
const $=s=>document.querySelector(s),t=localStorage.getItem('nexusParticipantToken')||'',q=new URLSearchParams(location.search),id=Number(q.get('id'));let lastWatchSig='';if(!t||!id)location.href='/';
const api=async u=>{const r=await fetch(u,{cache:'no-store',headers:{'X-Participant-Token':t,Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw new Error(d.error||'error');return d};
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const av=k=>`/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(k||'')?k:'avatar-01'}.webp`;
const keyImg=n=>`/passkeys/key-${n}.webp`,diceImg=n=>`/dice/dice-${n}.webp`;
const hands={rock:{jp:'グー',img:'/janken/rock.webp'},scissors:{jp:'チョキ',img:'/janken/scissors.webp'},paper:{jp:'パー',img:'/janken/paper.webp'}};
function players(m){return `<div class="watch-vs"><div><img src="${av(m.challenger.avatarKey)}"><img class="watch-title" src="/titles/${m.challenger.titleKey||'rookie'}.webp"><strong>${esc(m.challenger.name)}</strong></div><b>VS</b><div><img src="${av(m.opponent.avatarKey)}"><img class="watch-title" src="/titles/${m.opponent.titleKey||'rookie'}.webp"><strong>${esc(m.opponent.name)}</strong></div></div><div class="watch-meta"><strong>${m.gameType.toUpperCase()}</strong><span>${m.wager} BATTLE POINTS</span><em>${m.status}</em></div>`}
function keyRow(code,live=false){const a=String(code||'').split('');return `<div class="watch-key-row ${live?'live':''}">${[0,1,2,3].map(i=>a[i]?`<img src="${keyImg(a[i])}" alt="${a[i]}">`:`<span>?</span>`).join('')}</div>`}
function hbMarks(g,m){if(m.status!=='completed')return null;const target=Number(g.player_id)===Number(m.challenger.id)?String(m.opponentSecret||''):String(m.challengerSecret||'');if(target.length!==4)return null;return String(g.guess).split('').map((n,i)=>target[i]===n?'hit':target.includes(n)?'blow':'miss')}
function hbGuess(g,m){const marks=hbMarks(g,m);return `<div class="watch-hb-row"><div class="watch-hb-turn"><b>T${String(g.turn_no).padStart(2,'0')}</b><small>${esc(g.player_name)}</small></div><div class="watch-hb-code">${String(g.guess).split('').map((n,i)=>`<span class="${marks?marks[i]:''}"><img src="${keyImg(n)}" alt="${n}">${marks?`<i>${marks[i]==='hit'?'H':marks[i]==='blow'?'B':'—'}</i>`:''}</span>`).join('')}</div><div class="watch-hb-score"><strong class="hit">${g.hits} HIT</strong><strong class="blow">${g.blows} BLOW</strong></div></div>`}
function renderHB(d){const m=d.match,turnId=Number(m.turnPlayerId),live=m.liveSelection||'';const cLive=turnId===Number(m.challenger.id)?live:'',oLive=turnId===Number(m.opponent.id)?live:'';const rows=d.guesses.slice().reverse().map(g=>hbGuess(g,m)).join('');return `<div class="watch-game-head"><span>LIVE CODE INPUT</span><b>TURN ${String(m.turnNo||1).padStart(2,'0')}</b></div><div class="watch-hb-live"><section class="${cLive?'active':''}"><small>${esc(m.challenger.name)}</small>${keyRow(cLive,true)}</section><section class="${oLive?'active':''}"><small>${esc(m.opponent.name)}</small>${keyRow(oLive,true)}</section></div><div class="watch-legend"><span class="hit">HIT = 数字＋位置一致</span><span class="blow">BLOW = 数字のみ一致</span></div><div class="watch-history-title">SCAN HISTORY ${m.status==='completed'?'/ ANSWER REVIEW':''}</div><div class="watch-hb-history">${rows||'<div class="watch-empty">まだ確定したコードはありません</div>'}</div>`}
function handCard(name,choice,active){const h=hands[choice];return `<section class="watch-hand ${active?'active':''}"><small>${esc(name)}</small>${h?`<img src="${h.img}" alt="${h.jp}"><strong>${h.jp}</strong>`:`<div class="watch-hand-wait">?</div><strong>SELECTING</strong>`}</section>`}
function renderJK(d){const m=d.match,s=m.spectate||{},c=s.challengerJankenChoice,o=s.opponentJankenChoice;const hist=d.rounds.slice().reverse().map(r=>`<div class="watch-jk-round"><b>R${String(r.round_no).padStart(2,'0')}</b><img src="${hands[r.challenger_choice]?.img||''}"><span>VS</span><img src="${hands[r.opponent_choice]?.img||''}"><em>${String(r.result||'').toUpperCase()}</em></div>`).join('');return `<div class="watch-scoreboard"><section><small>${esc(m.challenger.name)}</small><b>${m.challengerJankenWins}</b></section><strong>BO5</strong><section><small>${esc(m.opponent.name)}</small><b>${m.opponentJankenWins}</b></section></div><div class="watch-game-head"><span>ROUND ${String(m.jankenRound||1).padStart(2,'0')} // LIVE HAND</span><b>FIRST TO 3</b></div><div class="watch-hands">${handCard(m.challenger.name,c,!!c)}${handCard(m.opponent.name,o,!!o)}</div><div class="watch-history-title">ROUND HISTORY</div><div class="watch-jk-history">${hist||'<div class="watch-empty">ラウンド進行待ち</div>'}</div>`}
function diceRow(dice){const a=String(dice||'').split(/[-,]/).filter(Boolean);return `<div class="watch-dice-row">${a.length?a.map(n=>`<img src="${diceImg(n)}" alt="${n}">`).join(''):'<span>?</span><span>?</span><span>?</span>'}</div>`}
function roleText(r){return String(r||'WAITING').replaceAll('_',' ').toUpperCase()}
function renderCC(d){const m=d.match;const hist=d.rolls.slice().reverse().map(r=>`<div class="watch-cc-roll"><div><b>R${r.round_no} / TRY ${r.attempt_no}</b><small>${esc(r.player_name)}</small></div>${diceRow(r.dice)}<em>${roleText(r.role)}</em></div>`).join('');return `<div class="watch-scoreboard"><section><small>${esc(m.challenger.name)}</small><b>${m.challengerChinchiroWins}</b></section><strong>BO3</strong><section><small>${esc(m.opponent.name)}</small><b>${m.opponentChinchiroWins}</b></section></div><div class="watch-game-head"><span>ROUND ${String(m.chinchiroRound||1).padStart(2,'0')} // LIVE DICE</span><b>TRY ${Number(m.chinchiroAttempt||0)+1}</b></div><div class="watch-cc-live"><section><small>${esc(m.challenger.name)}</small>${diceRow(m.challengerChinchiroDice)}<strong>${roleText(m.challengerChinchiroRole)}</strong></section><section><small>${esc(m.opponent.name)}</small>${diceRow(m.opponentChinchiroDice)}<strong>${roleText(m.opponentChinchiroRole)}</strong></section></div><div class="watch-history-title">ROLL HISTORY</div><div class="watch-cc-history">${hist||'<div class="watch-empty">最初のロール待ち</div>'}</div>`}
function render(d){const m=d.match;const sig=JSON.stringify([m,d.guesses,d.rounds,d.rolls]);if(sig===lastWatchSig)return;lastWatchSig=sig;let body=m.gameType==='hitblow'?renderHB(d):m.gameType==='janken'?renderJK(d):renderCC(d);$('#watchStage').innerHTML=players(m)+body}
async function load(){try{render(await api('/api/spectate/quick/'+id))}catch(e){$('#watchStage').innerHTML='<p>'+esc(e.message)+'</p>'}}setInterval(load,650);load();
</script></body></html>
