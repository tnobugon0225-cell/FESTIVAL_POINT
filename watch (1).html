<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVE SPECTATE // NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script><style>
.watch-game{margin-top:18px}.watch-section{border:1px solid #16485b;background:#03111dcc;padding:14px;margin-top:12px}.watch-label{font:700 12px/1.2 monospace;letter-spacing:.16em;color:#73eaff;margin-bottom:9px}.watch-secret-grid,.watch-live-grid,.watch-hand-grid,.watch-dice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.watch-code-card,.watch-hand,.watch-score{border:1px solid #19556a;padding:10px;min-width:0}.watch-code-card b,.watch-hand b{display:block;margin-bottom:8px}.watch-keys{display:flex;gap:5px;justify-content:center}.watch-key{width:min(19vw,66px);aspect-ratio:1;object-fit:contain}.watch-key.small{width:min(11vw,42px)}.watch-empty{height:min(19vw,66px);display:grid;place-items:center;color:#6e8390;font:700 11px monospace}.watch-live{border-color:#8a4cff;box-shadow:0 0 16px #8a4cff22}.watch-turn{color:#c884ff;font-weight:800;text-align:center;margin:7px 0}.watch-history{display:grid;gap:8px}.watch-row{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:8px;border:1px solid #16485b;padding:8px}.watch-result{color:#70ecff;font-style:italic;white-space:nowrap}.watch-hit{outline:2px solid #64ffe1;filter:drop-shadow(0 0 5px #64ffe1)}.watch-blow{outline:2px solid #d079ff;filter:drop-shadow(0 0 5px #d079ff)}.watch-miss{opacity:.45}.watch-legend{font-size:11px;color:#8ea3ae;margin-top:8px}.watch-hand img{width:100%;max-width:145px;display:block;margin:auto}.watch-hand strong,.watch-score strong{display:block;text-align:center;font-size:22px}.watch-scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.watch-dice{display:flex;gap:6px;justify-content:center}.watch-dice img{width:min(18vw,64px);height:auto}.watch-role{text-align:center;color:#70ecff;font-size:20px;margin-top:7px}.watch-current{border-color:#70ecff}.watch-round{font-size:12px;color:#9cb1bd}.watch-meta{margin-bottom:10px}@media(max-width:520px){.watch-row{grid-template-columns:58px 1fr auto}.watch-secret-grid,.watch-hand-grid{gap:6px}.watch-section{padding:10px}.watch-key{width:min(18vw,58px)}}
</style></head><body class="player-page watch-page"><main class="app-shell"><section class="system-panel"><div class="panel-head"><div><div class="eyebrow">LIVE SPECTATE</div><h1>観戦リンク</h1></div><a href="/network#live" class="asset-back-link"><img src="/ui/v576/back.webp" alt="BACK"></a></div><div id="watchStage"></div></section></main><script>
const $=s=>document.querySelector(s),t=localStorage.getItem('nexusParticipantToken')||'',q=new URLSearchParams(location.search),id=Number(q.get('id'));if(!t||!id)location.href='/';
const api=async u=>{const r=await fetch(u,{cache:'no-store',headers:{'X-Participant-Token':t,Authorization:'Bearer '+t}}),d=await r.json();if(!r.ok)throw Error(d.error||'error');return d};
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML},av=k=>`/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(k||'')?k:'avatar-01'}.webp`,key=n=>`/passkeys/key-${n}.webp`,hand=x=>`/janken/${x}.webp`,die=n=>`/dice/dice-${n}.webp`;
const keys=(code,small=false,classes=[])=>{const a=String(code||'').split('').filter(x=>/\d/.test(x));return a.length?`<div class="watch-keys">${a.map((n,i)=>`<img class="watch-key ${small?'small':''} ${classes[i]||''}" src="${key(n)}" alt="${n}">`).join('')}</div>`:`<div class="watch-empty">SETTING / WAITING</div>`};
function hbClasses(guess,secret){guess=String(guess||'');secret=String(secret||'');return guess.split('').map((n,i)=>n===secret[i]?'watch-hit':secret.includes(n)?'watch-blow':'watch-miss')}
function hb(d,m){const turn=Number(m.turnPlayerId),turnName=turn===Number(m.challenger.id)?m.challenger.name:m.opponent.name;let live=m.liveSelection||'';const rows=d.guesses.slice().reverse().map(g=>{const target=Number(g.player_id)===Number(m.challenger.id)?m.opponentSecret:m.challengerSecret;return `<div class="watch-row"><b>${esc(g.player_name)}</b><span>${keys(g.guess,true,hbClasses(g.guess,target))}</span><em class="watch-result">${g.hits}H / ${g.blows}B</em></div>`}).join('');return `<div class="watch-game"><div class="watch-section"><div class="watch-label">SECRET CODE // SPECTATOR VIEW</div><div class="watch-secret-grid"><div class="watch-code-card"><b>${esc(m.challenger.name)}</b>${keys(m.challengerSecret)}</div><div class="watch-code-card"><b>${esc(m.opponent.name)}</b>${keys(m.opponentSecret)}</div></div></div>${m.status==='in_progress'?`<div class="watch-section watch-live"><div class="watch-label">LIVE INPUT</div><div class="watch-turn">${esc(turnName)} // TURN ${m.turnNo}</div>${keys(live)}</div>`:''}<div class="watch-section"><div class="watch-label">SCAN HISTORY</div><div class="watch-history">${rows||'<div class="watch-empty">NO SCAN YET</div>'}</div><div class="watch-legend">CYAN = HIT　PURPLE = BLOW　DIM = MISS</div></div></div>`}
function jk(d,m){const c=m.spectate?.challengerJankenChoice,o=m.spectate?.opponentJankenChoice;const rows=d.rounds.slice().reverse().map(r=>`<div class="watch-row"><b>R${r.round_no}</b><span class="watch-keys"><img class="watch-key small" src="${hand(r.challenger_choice)}"><b>VS</b><img class="watch-key small" src="${hand(r.opponent_choice)}"></span><em class="watch-result">${esc(r.result).toUpperCase()}</em></div>`).join('');return `<div class="watch-game"><div class="watch-scoreboard"><div class="watch-score"><span>${esc(m.challenger.name)}</span><strong>${m.challengerJankenWins} WIN</strong></div><div class="watch-score"><span>${esc(m.opponent.name)}</span><strong>${m.opponentJankenWins} WIN</strong></div></div>${m.status==='in_progress'?`<div class="watch-section watch-live"><div class="watch-label">LIVE SIGNAL // ROUND ${m.jankenRound}</div><div class="watch-hand-grid"><div class="watch-hand"><b>${esc(m.challenger.name)}</b>${c?`<img src="${hand(c)}"><strong>${c.toUpperCase()}</strong>`:'<div class="watch-empty">SELECTING</div>'}</div><div class="watch-hand"><b>${esc(m.opponent.name)}</b>${o?`<img src="${hand(o)}"><strong>${o.toUpperCase()}</strong>`:'<div class="watch-empty">SELECTING</div>'}</div></div></div>`:''}<div class="watch-section"><div class="watch-label">ROUND HISTORY</div><div class="watch-history">${rows||'<div class="watch-empty">NO ROUND YET</div>'}</div></div></div>`}
function diceVals(v){return String(v||'').split(/[-,]/).map(Number).filter(n=>n>=1&&n<=6)}function diceHtml(v){const a=diceVals(v);return a.length?`<div class="watch-dice">${a.map(n=>`<img src="${die(n)}" alt="${n}">`).join('')}</div>`:'<div class="watch-empty">AWAITING ROLL</div>'}
function cc(d,m){const latest=d.rolls[d.rolls.length-1];const rows=d.rolls.slice().reverse().map(r=>`<div class="watch-row"><b>${esc(r.player_name)}</b><span>${diceHtml(r.dice)}</span><em class="watch-result">${esc(r.role).toUpperCase()}</em></div>`).join('');return `<div class="watch-game"><div class="watch-scoreboard"><div class="watch-score"><span>${esc(m.challenger.name)}</span><strong>${m.challengerChinchiroWins} WIN</strong></div><div class="watch-score"><span>${esc(m.opponent.name)}</span><strong>${m.opponentChinchiroWins} WIN</strong></div></div>${m.status==='in_progress'?`<div class="watch-section watch-current"><div class="watch-label">LIVE DICE // ROUND ${m.chinchiroRound}</div>${latest?`<b>${esc(latest.player_name)}</b>${diceHtml(latest.dice)}<div class="watch-role">${esc(latest.role).toUpperCase()}</div>`:'<div class="watch-empty">AWAITING ROLL</div>'}</div>`:''}<div class="watch-section"><div class="watch-label">ROLL HISTORY</div><div class="watch-history">${rows||'<div class="watch-empty">NO ROLL YET</div>'}</div></div></div>`}
let lastRenderKey='',hasRendered=false;
function render(d){const renderKey=JSON.stringify(d);if(renderKey===lastRenderKey)return;lastRenderKey=renderKey;const m=d.match;let body=m.gameType==='hitblow'?hb(d,m):m.gameType==='janken'?jk(d,m):cc(d,m);$('#watchStage').innerHTML=`<div class="watch-vs"><div><img src="${av(m.challenger.avatarKey)}"><img class="watch-title" src="/titles/${m.challenger.titleKey||'rookie'}.webp"><strong>${esc(m.challenger.name)}</strong></div><b>VS</b><div><img src="${av(m.opponent.avatarKey)}"><img class="watch-title" src="/titles/${m.opponent.titleKey||'rookie'}.webp"><strong>${esc(m.opponent.name)}</strong></div></div><div class="watch-meta"><strong>${m.gameType.toUpperCase()}</strong><span>${m.wager} BATTLE POINTS</span><em>${m.status}</em></div>${body}`;hasRendered=true}
async function load(){try{render(await api('/api/spectate/quick/'+id))}catch(e){if(!hasRendered)$('#watchStage').innerHTML=`<p class="error">${esc(e.message)}</p>`}}load();setInterval(load,500);
</script></body></html>
