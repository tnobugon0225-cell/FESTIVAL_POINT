<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVE SPECTATE // NEXUS:ZERO</title><link rel="stylesheet" href="/style.css"><script src="/bgm.js" defer></script></head><body class="player-page watch-page"><main class="app-shell"><section class="system-panel watch-panel"><div class="panel-head"><div><div class="eyebrow">LIVE SPECTATE</div><h1>観戦リンク</h1></div><a href="/network#live" class="asset-back-link" aria-label="BACK"><img src="/ui/v576/back.webp" alt="BACK"></a></div><div id="watchStage"></div></section></main><script>
const $=s=>document.querySelector(s),t=localStorage.getItem('nexusParticipantToken')||'',q=new URLSearchParams(location.search),id=Number(q.get('id'));let lastWatchSig='';if(!t||!id)location.href='/';
const api=async u=>{const r=await fetch(u,{cache:'no-store',headers:{'X-Participant-Token':t,Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw new Error(d.error||'error');return d};
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};const av=k=>`/avatars/${/^avatar-(0[1-9]|1[0-2])$/.test(k||'')?k:'avatar-01'}.webp`;const key=n=>`/passkeys/key-${n}.webp`;const hand=k=>`/janken/${k}.webp`;const die=n=>`/dice/dice-${n}.webp`;
function player(p){return `<div><img src="${av(p.avatarKey)}"><img class="watch-title" src="/titles/${p.titleKey||'rookie'}.webp"><strong>${esc(p.name)}</strong></div>`}
function codeImgs(code,empty='SELECTING'){const a=String(code||'').split('').filter(n=>/^\d$/.test(n));return `<div class="watch-code">${[0,1,2,3].map((_,i)=>a[i]?`<img src="${key(a[i])}" alt="${a[i]}">`:`<span>${i<a.length?'':'?'}</span>`).join('')}</div>${a.length?`<small>${a.length}/4 SELECTED</small>`:`<small>${empty}</small>`}`}
function diceNums(v){return String(v||'').match(/[1-6]/g)||[]}
function base(m){return `<div class="watch-vs">${player(m.challenger)}<b>VS</b>${player(m.opponent)}</div><div class="watch-meta"><strong>${m.gameType.toUpperCase()}</strong><span>${m.wager} BATTLE POINTS</span><em>${m.status==='in_progress'?'LIVE':m.status.toUpperCase()}</em></div>`}
function hb(d){const m=d.match,live=m.spectate?.liveSelection||m.liveSelection||'',turn=Number(m.spectate?.turnPlayerId||m.turnPlayerId),who=turn===Number(m.challenger.id)?m.challenger:m.opponent;const cSecret=m.spectate?.challengerSecret||m.challengerSecret||'',oSecret=m.spectate?.opponentSecret||m.opponentSecret||'';const secrets=(cSecret||oSecret)?`<div class="watch-secret-grid"><section><b>${esc(m.challenger.name)} SECRET CODE</b>${codeImgs(cSecret,'SETTING')}</section><section><b>${esc(m.opponent.name)} SECRET CODE</b>${codeImgs(oSecret,'SETTING')}</section></div>`:'';return `${secrets}<div class="watch-live-box"><span>NOW SELECTING // ${esc(who?.name||'---')}</span>${codeImgs(live,'WAITING FOR INPUT')}</div><div class="watch-history-title">SCAN HISTORY</div><div class="watch-hb-history">${d.guesses.slice().reverse().map(g=>`<div class="watch-hb-row"><div><b>TURN ${String(g.turn_no).padStart(2,'0')}</b><small>${esc(g.player_name)}</small></div>${codeImgs(g.guess,'')}<div class="watch-hb-score"><strong>${g.hits}<i>HIT</i></strong><strong>${g.blows}<i>BLOW</i></strong></div></div>`).join('')||'<p class="watch-empty">NO SCAN DATA</p>'}</div>`}
function jk(d){const m=d.match,c=m.spectate?.challengerJankenChoice,o=m.spectate?.opponentJankenChoice;const card=(p,ch,w)=>`<section class="watch-hand ${ch?'locked':''}"><b>${esc(p.name)}</b>${ch?`<img src="${hand(ch)}"><strong>${ch.toUpperCase()}</strong>`:'<div class="watch-hand-wait">SELECTING...</div>'}<span>${w} WIN</span></section>`;return `<div class="watch-scoreline"><strong>${m.challengerJankenWins}</strong><span>ROUND ${String(m.jankenRound||1).padStart(2,'0')}</span><strong>${m.opponentJankenWins}</strong></div><div class="watch-hand-grid">${card(m.challenger,c,m.challengerJankenWins)}<b>VS</b>${card(m.opponent,o,m.opponentJankenWins)}</div><div class="watch-history-title">ROUND HISTORY</div><div class="watch-jk-history">${d.rounds.slice().reverse().map(r=>`<div><b>R${r.round_no}</b><img src="${hand(r.challenger_choice)}"><span>VS</span><img src="${hand(r.opponent_choice)}"><em>${r.result.toUpperCase()}</em></div>`).join('')||'<p class="watch-empty">NO ROUND DATA</p>'}</div>`}
function cc(d){const m=d.match,latest=d.rolls[d.rolls.length-1],nums=diceNums(latest?.dice);return `<div class="watch-scoreline"><strong>${m.challengerChinchiroWins||0}</strong><span>ROUND ${String(m.chinchiroRound||1).padStart(2,'0')} // BO3</span><strong>${m.opponentChinchiroWins||0}</strong></div><div class="watch-live-box"><span>${latest?`${esc(latest.player_name)} // ROLL ${latest.attempt_no}`:'AWAITING ROLL'}</span><div class="watch-live-dice">${nums.length?nums.map(n=>`<img src="${die(n)}" alt="${n}">`).join(''):'<i>?</i><i>?</i><i>?</i>'}</div><strong>${latest?esc(String(latest.role).toUpperCase()):'WAITING'}</strong></div><div class="watch-history-title">ROLL HISTORY</div><div class="watch-cc-history">${d.rolls.slice().reverse().map(r=>{const ns=diceNums(r.dice);return `<div><span><b>R${r.round_no}</b> ${esc(r.player_name)} / TRY ${r.attempt_no}</span><span class="watch-dice-mini">${ns.map(n=>`<img src="${die(n)}">`).join('')}</span><em>${esc(String(r.role).toUpperCase())}</em></div>`}).join('')||'<p class="watch-empty">NO ROLL DATA</p>'}</div>`}
function render(d){const sig=JSON.stringify(d);if(sig===lastWatchSig)return;lastWatchSig=sig;const m=d.match;$('#watchStage').innerHTML=base(m)+(m.gameType==='hitblow'?hb(d):m.gameType==='janken'?jk(d):cc(d))}
async function load(){try{render(await api('/api/spectate/quick/'+id))}catch(e){$('#watchStage').innerHTML='<p>'+esc(e.message)+'</p>'}}setInterval(load,650);load();
</script></body></html>
